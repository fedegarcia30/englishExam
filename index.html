  qSh.opciones.forEach(opt => {
    let cls = 'opt-btn';
    if(state.finalAnswered) {
      if(opt === q.correcta) cls += ' correct';
      else if(opt === state.finalUserAnswer && opt !== q.correcta) cls += ' wrong';
    }
    optionsHTML += `<button class="${cls}" data-action="finalAnswer" data-opt="${opt}" ${state.finalAnswered?'disabled':''}>${opt}</button>`;
  });

  let feedbackHTML = '';
  if(state.finalAnswered) {
    const ok = state.finalUserAnswer === q.correcta;
    feedbackHTML = ok
      ? `<div class="feedback correct">✅ Correct!/div>`
      : `<div class="feedback wrong">❌ ${q.explicacion}</div>`;
  }

  let actionHTML = state.finalAnswered
    ? `<div class="action-row"><button class="btn-next" data-action="finalNext">${n<total?'Next →':'See final score'}</button></div>`
    : '';

  return `
  <div class="section-header">
    <button class="btn-back" data-action="home">← Home</button>
    <h2>🏆 Final Exam</h2>
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><span>Question ${n} of ${total} · ${lvlLabel}</span><span>${state.finalCorrect} correct</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="q-card">
    <div class="q-meta"><span class="q-num">Final Exam</span></div>
    <div class="q-text">${q.texto}</div>
    <div class="options">${optionsHTML}</div>
    ${feedbackHTML}
    ${actionHTML}
  </div>`;
}

// ── FINAL SCORE ─────────────────────────
function renderFinalScore() {
  const s = state.finalCorrect;
  let icon, msg, color;
  if(s <= 10) { icon='😓'; msg='Keep practising – you can do it!'; color='var(--red)'; }
  else if(s <= 20) { icon='🙂'; msg='Good, but review the topics where you made mistakes.'; color='var(--amber)'; }
  else { icon='🌟'; msg='Excellent! You\'ve mastered the grammar and vocabulary.'; color='var(--green)'; }

  const resultsHTML = state.finalResults.map(r => `
    <div class="result-item ${r.ok?'ok':'ko'}">
      <div class="ri-q">${r.ok?'✅':'❌'} ${r.q}</div>
      ${!r.ok ? `<div class="ri-ans">Correct: <b>${r.correcta}</b></div>` : ''}
    </div>`).join('');

  return `
  <div class="section-header">
    <button class="btn-back" data-action="home">← Home</button>
    <h2>🏆 Final Result</h2>
  </div>
  <div class="score-card">
    <div class="score-icon">${icon}</div>
    <div class="score-big" style="color:${color}">${s}/30</div>
    <div class="score-label">correct answers in the final exam</div>
    <div class="score-msg">${msg}</div>
    <button class="btn-primary" data-action="retryFinal">Retake exam 🔄</button>
    <button class="btn-secondary" data-action="gotoPractice">Practise by topic</button>
    <button class="btn-secondary" data-action="home">Home</button>
    <div class="results-list">${resultsHTML}</div>
  </div>`;
}

// ════════════════════════════════════════
//  EVENTS
// ════════════════════════════════════════
function attachEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleAction);
  });
}

function handleAction(e) {
  const action = e.currentTarget.dataset.action;
  switch(action) {
    case 'home': state.screen='home'; render(); break;
    case 'gotoPractice': state.screen='topicPicker'; render(); break;

    case 'startPractice': {
      const topicId = e.currentTarget.dataset.topic;
      state.practiceTopicId = topicId;
      const pool = ALL_QUESTIONS.filter(q => q.tema === topicId);
      state.practiceQueue = shuffle(pool);
      state.practiceIndex = 0;
      state.practiceAnswered = false;
      state.practiceUserAnswer = null;
      state.screen = 'practice';
      render(); break;
    }
    case 'practiceAnswer': {
      if(state.practiceAnswered) return;
      state.practiceUserAnswer = e.currentTarget.dataset.opt;
      const q = state.practiceQueue[state.practiceIndex % state.practiceQueue.length];
      state.practiceAnswered = true;
      render(); break;
    }
    case 'practiceNext': {
      state.practiceIndex++;
      if(state.practiceIndex >= state.practiceQueue.length) {
        state.practiceQueue = shuffle(state.practiceQueue);
        state.practiceIndex = 0;
      }
      state.practiceAnswered = false;
      state.practiceUserAnswer = null;
      render(); break;
    }

    case 'gotoDiag': startDiag(); break;
    case 'diagAnswer': {
      if(state.diagAnswered) return;
      state.diagUserAnswer = e.currentTarget.dataset.opt;
      const q = state.diagQuestions[state.diagIndex];
      if(state.diagUserAnswer === q.correcta) state.diagCorrect++;
      state.diagAnswered = true;
      render(); break;
    }
    case 'diagNext': {
      state.diagIndex++;
      state.diagAnswered = false;
      state.diagUserAnswer = null;
      if(state.diagIndex >= state.diagQuestions.length) {
        state.screen = 'diagScore';
      }
      render(); break;
    }
    case 'retryDiag': {
      state.diagAttempt++;
      startDiag(); break;
    }

    case 'gotoFinal': startFinal(); break;
    case 'finalAnswer': {
      if(state.finalAnswered) return;
      state.finalUserAnswer = e.currentTarget.dataset.opt;
      const q = state.finalQuestions[state.finalIndex];
      const ok = state.finalUserAnswer === q.correcta;
      if(ok) state.finalCorrect++;
      state.finalResults.push({ q: q.texto.substring(0,60)+'...', ok, correcta: q.correcta });
      state.finalAnswered = true;
      render(); break;
    }
    case 'finalNext': {
      state.finalIndex++;
      state.finalAnswered = false;
      state.finalUserAnswer = null;
      if(state.finalIndex >= state.finalQuestions.length) {
        state.screen = 'finalScore';
      }
      render(); break;
    }
    case 'retryFinal': {
      state.finalPrevIds = state.finalQuestions.map(q=>q.id);
      startFinal(); break;
    }

    case 'gotoVocabExam': startVocabExam(); break;
    case 'vocabAnswer': {
      if(state.vocabExamAnswered) return;
      state.vocabExamUserAnswer = e.currentTarget.dataset.opt;
      const vq = state.vocabExamQuestions[state.vocabExamIndex];
      const ok = state.vocabExamUserAnswer === vq.correcta;
      if(ok) state.vocabExamCorrect++;
      state.vocabExamResults.push({ q: vq.texto.substring(0,60)+'...', ok, correcta: vq.correcta });
      state.vocabExamAnswered = true;
      render(); break;
    }
    case 'vocabNext': {
      state.vocabExamIndex++;
      state.vocabExamAnswered = false;
      state.vocabExamUserAnswer = null;
      if(state.vocabExamIndex >= state.vocabExamQuestions.length) {
        state.screen = 'vocabScore';
      }
      render(); break;
    }
    case 'retryVocab': {
      state.vocabExamPrevIds = state.vocabExamQuestions.map(q=>q.vid);
      startVocabExam(); break;
    }
  }
}

// ════════════════════════════════════════
//  STARTERS
// ════════════════════════════════════════
function startDiag() {
  const ids = pickN(DIAG_IDS, 10, state.diagPrevIds);
  state.diagPrevIds = [...state.diagPrevIds, ...ids].slice(-20);
  state.diagQuestions = ids.map(id => getQ(id)).filter(Boolean);
  state.diagIndex = 0;
  state.diagCorrect = 0;
  state.diagAnswered = false;
  state.diagUserAnswer = null;
  state.screen = 'diag';
  render();
}

function startFinal() {
  // 70% U8-10 = 21 questions, 30% U5-7 = 9 questions
  const u810ids = FINAL_IDS.filter(id => {
    const q = getQ(id);
    return q && ['u8_voc','u8_gram','u9_voc','u9_gram','u10_voc','u10_gram'].includes(q.tema);
  });
  const u57ids = FINAL_IDS.filter(id => {
    const q = getQ(id);
    return q && ['u5_voc','u5_gram','u6_voc','u6_gram','u7_voc','u7_gram'].includes(q.tema);
  });

  const picked810 = pickN(u810ids, 21, state.finalPrevIds);
  const picked57 = pickN(u57ids, 9, state.finalPrevIds);
  const allPicked = shuffle([...picked810, ...picked57]);

  state.finalQuestions = allPicked.map(id => getQ(id)).filter(Boolean);
  // Sort by nivel (1,2,3) for increasing difficulty
  state.finalQuestions.sort((a,b) => (a.nivel||1) - (b.nivel||1));

  state.finalIndex = 0;
  state.finalCorrect = 0;
  state.finalAnswered = false;
  state.finalUserAnswer = null;
  state.finalResults = [];
  state.screen = 'final';
  render();
}


function startVocabExam() {
  // 70% from U8-10 = 21 questions, 30% from U6-7 = 9 questions
  const u810 = VOC_QUESTIONS.filter(q => [8,9,10].includes(q.unit));
  const u67  = VOC_QUESTIONS.filter(q => [6,7].includes(q.unit));

  function pickVocab(pool, n, exclude) {
    const avail = pool.filter(q => !exclude.includes(q.vid));
    const shuffled = shuffle([...avail]);
    // Sort by nivel for difficulty progression, then pick
    return shuffled.slice(0, n);
  }

  const prevIds = state.vocabExamPrevIds || [];
  let picked810 = pickVocab(u810, 21, prevIds);
  let picked67  = pickVocab(u67, 9, prevIds);

  // If not enough after exclusion, fill from full pool
  if(picked810.length < 21) picked810 = shuffle([...u810]).slice(0,21);
  if(picked67.length < 9)   picked67  = shuffle([...u67]).slice(0,9);

  const all = shuffle([...picked810, ...picked67]);
  // Sort ascending by nivel for difficulty progression
  all.sort((a,b) => (a.nivel||1)-(b.nivel||1));

  state.vocabExamQuestions = all;
  state.vocabExamIndex = 0;
  state.vocabExamCorrect = 0;
  state.vocabExamAnswered = false;
  state.vocabExamUserAnswer = null;
  state.vocabExamResults = [];
  state.screen = 'vocabExam';
  render();
}

// ════════════════════════════════════════
//  INIT
// ════════════════════════════════════════
render();
</script>
