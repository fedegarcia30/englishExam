<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English B1+ · 2º ESO</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════ TOKENS ═══════════════════════════════ */
:root{
  --ink:#12111a;--paper:#faf9f6;--card:#ffffff;
  --grape:#5b21b6;--grape2:#7c3aed;--grape3:#a78bfa;--grape-pale:#f3f0ff;
  --coral:#e85d3c;--coral-pale:#fff1ee;
  --teal:#0e9f8c;--teal-pale:#e8faf8;
  --amber:#d97706;--amber-pale:#fffbeb;
  --lime:#4d7c0f;--lime-pale:#f1f8e8;
  --muted:#6b7280;--border:#e5e4e2;
  --radius:16px;--radius-sm:10px;
  --shadow:0 2px 16px rgba(91,33,182,.09);
  --shadow-lg:0 8px 40px rgba(91,33,182,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
h1,h2,h3,h4{font-family:'Sora',sans-serif}
button{cursor:pointer;font-family:inherit}
a{color:inherit}

/* ═══════════════════════════════ LAYOUT ════════════════════════════════ */
#app{max-width:780px;margin:0 auto;padding:20px 16px 80px}

/* ═══════════════════════════════ HOME ══════════════════════════════════ */
.home-hero{
  background:linear-gradient(135deg,var(--grape) 0%,#2d1b69 100%);
  border-radius:24px;padding:40px 32px;margin-bottom:24px;
  color:#fff;position:relative;overflow:hidden
}
.home-hero::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.home-tag{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
.home-hero h1{font-size:2rem;font-weight:800;line-height:1.15;margin-bottom:8px}
.home-hero p{font-size:.95rem;opacity:.8}

.module-grid{display:grid;gap:14px}
.module-card{
  background:var(--card);border-radius:var(--radius);padding:22px 20px;
  border:2px solid var(--border);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:18px;
  transition:all .18s ease;position:relative;overflow:hidden
}
.module-card:hover{border-color:var(--grape2);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.module-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:4px 0 0 4px}
.mc-purple::before{background:var(--grape2)}
.mc-teal::before{background:var(--teal)}
.mc-coral::before{background:var(--coral)}
.mc-amber::before{background:var(--amber)}
.module-icon{font-size:2rem;flex-shrink:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:14px}
.mc-purple .module-icon{background:var(--grape-pale)}
.mc-teal .module-icon{background:var(--teal-pale)}
.mc-coral .module-icon{background:var(--coral-pale)}
.mc-amber .module-icon{background:var(--amber-pale)}
.module-title{font-family:'Sora',sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:3px}
.module-desc{font-size:.83rem;color:var(--muted);line-height:1.4}
.module-badge{
  margin-left:auto;font-size:.7rem;font-weight:700;padding:4px 10px;
  border-radius:20px;white-space:nowrap;flex-shrink:0
}
.mc-purple .module-badge{background:var(--grape-pale);color:var(--grape)}
.mc-teal .module-badge{background:var(--teal-pale);color:var(--teal)}
.mc-coral .module-badge{background:var(--coral-pale);color:var(--coral)}
.mc-amber .module-badge{background:var(--amber-pale);color:var(--amber)}

/* ═══════════════════════════════ SECTION HEADER ═══════════════════════ */
.sec-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.sec-hdr h2{font-size:1.15rem;font-weight:800;color:var(--grape)}
.btn-back{background:none;border:2px solid var(--grape-pale);color:var(--grape);border-radius:var(--radius-sm);padding:6px 14px;font-size:.85rem;font-weight:600;transition:all .15s}
.btn-back:hover{background:var(--grape-pale)}

/* ═══════════════════════════════ TOPIC PICKER ══════════════════════════ */
.topics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.topic-btn{
  background:var(--card);border:2px solid var(--border);border-radius:14px;
  padding:16px 14px;text-align:left;transition:all .15s
}
.topic-btn:hover{border-color:var(--grape2);background:var(--grape-pale)}
.topic-unit{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--grape);margin-bottom:4px}
.topic-name{font-family:'Sora',sans-serif;font-size:.92rem;font-weight:700;color:var(--ink);margin-bottom:2px}
.topic-type{font-size:.75rem;color:var(--muted)}

/* ═══════════════════════════════ PROGRESS ══════════════════════════════ */
.prog-wrap{margin-bottom:16px}
.prog-top{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:600}
.prog-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--grape2),var(--coral));border-radius:4px;transition:width .4s ease}
.prog-stats{display:flex;gap:16px;margin-bottom:14px}
.stat-chip{
  background:var(--card);border:2px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 14px;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:6px
}
.stat-chip.good{border-color:var(--lime);background:var(--lime-pale);color:var(--lime)}
.stat-chip.bad{border-color:var(--coral);background:var(--coral-pale);color:var(--coral)}

/* ═══════════════════════════════ QUESTION CARD ═════════════════════════ */
.q-card{background:var(--card);border-radius:20px;padding:26px 22px;box-shadow:var(--shadow);border:2px solid var(--border)}
.q-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.q-badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.badge-type{background:#f3f0ff;color:var(--grape)}
.badge-unit{background:#f0f9f8;color:var(--teal)}
.badge-lvl1{background:#fffbeb;color:var(--amber)}
.badge-lvl2{background:#fff7ed;color:#c2410c}
.badge-lvl3{background:#fef2f2;color:#b91c1c}
.q-hint-btn{background:none;border:1.5px dashed var(--muted);color:var(--muted);border-radius:8px;padding:3px 10px;font-size:.75rem;font-weight:600;transition:all .15s;white-space:nowrap}
.q-hint-btn:hover{border-color:var(--amber);color:var(--amber)}
.hint-box{background:var(--amber-pale);border:2px solid #fde68a;border-radius:var(--radius-sm);padding:10px 14px;font-size:.88rem;color:#92400e;margin-bottom:14px;line-height:1.5}
.q-text{font-size:1.05rem;font-weight:600;line-height:1.55;margin-bottom:18px}
.q-text b{color:var(--grape2)}

/* options */
.opts{display:grid;gap:9px}
.opt{
  background:var(--paper);border:2px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 16px;text-align:left;font-size:.97rem;font-weight:500;
  transition:all .15s;color:var(--ink);display:flex;align-items:center;gap:10px
}
.opt:hover:not(:disabled){border-color:var(--grape2);background:var(--grape-pale)}
.opt:disabled{cursor:default}
.opt-letter{
  width:26px;height:26px;border-radius:50%;background:var(--border);
  font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s
}
.opt.correct{background:var(--lime-pale);border-color:var(--lime);color:var(--lime)}
.opt.correct .opt-letter{background:var(--lime);color:#fff}
.opt.wrong{background:var(--coral-pale);border-color:var(--coral);color:var(--coral)}
.opt.wrong .opt-letter{background:var(--coral);color:#fff}

/* match exercise */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.match-col h4{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.match-item{
  background:var(--paper);border:2px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 13px;font-size:.9rem;font-weight:500;text-align:left;
  transition:all .15s;cursor:pointer
}
.match-item.selected{border-color:var(--grape2);background:var(--grape-pale)}
.match-item.matched-ok{border-color:var(--lime);background:var(--lime-pale);color:var(--lime);cursor:default}
.match-item.matched-err{border-color:var(--coral);background:var(--coral-pale);color:var(--coral)}
.match-item:disabled{cursor:default}

/* fill-in */
.fill-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fill-input{
  border:2px solid var(--grape2);border-radius:var(--radius-sm);padding:10px 14px;
  font-size:1rem;font-family:'DM Sans',sans-serif;outline:none;min-width:160px;
  transition:border .15s
}
.fill-input:focus{border-color:var(--grape);box-shadow:0 0 0 3px rgba(91,33,182,.12)}
.fill-input.ok{border-color:var(--lime);background:var(--lime-pale);color:var(--lime)}
.fill-input.err{border-color:var(--coral);background:var(--coral-pale);color:var(--coral)}
.btn-check{
  background:var(--grape2);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:11px 20px;font-weight:700;font-size:.95rem;transition:background .15s
}
.btn-check:hover{background:var(--grape)}
.btn-check:disabled{background:var(--muted);cursor:default}

/* categorise */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.cat-zone{
  background:var(--paper);border:2px dashed var(--border);border-radius:var(--radius-sm);
  padding:12px;min-height:80px
}
.cat-zone h4{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.cat-word{
  display:inline-block;background:var(--card);border:2px solid var(--border);
  border-radius:8px;padding:5px 12px;font-size:.88rem;font-weight:600;
  margin:3px;cursor:pointer;transition:all .15s
}
.cat-word:hover{border-color:var(--grape2)}
.cat-word.placed-ok{background:var(--lime-pale);border-color:var(--lime);color:var(--lime);cursor:default}
.cat-word.placed-err{background:var(--coral-pale);border-color:var(--coral);color:var(--coral)}
.word-bank{margin-bottom:14px}
.word-bank h4{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}

/* feedback */
.feedback{margin-top:14px;border-radius:var(--radius-sm);padding:13px 16px;font-size:.9rem;line-height:1.55}
.feedback.ok{background:var(--lime-pale);border-left:4px solid var(--lime);color:#166534}
.feedback.err{background:var(--coral-pale);border-left:4px solid var(--coral);color:#7f1d1d}

/* action row */
.act-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn-next{
  background:var(--grape2);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:13px 24px;font-weight:800;font-size:.97rem;flex:1;transition:background .15s
}
.btn-next:hover{background:var(--grape)}
.btn-sec{
  background:none;border:2px solid var(--grape-pale);color:var(--grape);
  border-radius:var(--radius-sm);padding:12px 18px;font-weight:700;font-size:.9rem;
  transition:all .15s
}
.btn-sec:hover{background:var(--grape-pale)}

/* ═══════════════════════════════ SCORE ═════════════════════════════════ */
.score-card{background:var(--card);border-radius:24px;padding:40px 28px;text-align:center;box-shadow:var(--shadow-lg);border:2px solid var(--border)}
.score-emoji{font-size:3.5rem;margin-bottom:8px}
.score-num{font-family:'Sora',sans-serif;font-size:3.8rem;font-weight:900}
.score-denom{font-size:1.4rem;color:var(--muted);margin-left:4px}
.score-label{font-size:.9rem;color:var(--muted);margin-bottom:16px}
.score-msg{font-size:1.1rem;font-weight:700;margin:14px 0 26px;line-height:1.4}
.score-meter{height:12px;background:var(--border);border-radius:6px;margin:16px 0;overflow:hidden}
.score-meter-fill{height:100%;border-radius:6px;transition:width 1s ease}
.btn-prim{
  background:var(--grape2);color:#fff;border:none;border-radius:14px;
  padding:14px 26px;font-weight:800;font-size:1rem;margin:5px;
  display:inline-block;transition:background .15s
}
.btn-prim:hover{background:var(--grape)}
.btn-outline{
  background:none;border:2px solid var(--grape2);color:var(--grape2);
  border-radius:14px;padding:14px 26px;font-weight:800;font-size:1rem;
  margin:5px;display:inline-block;transition:all .15s
}
.btn-outline:hover{background:var(--grape-pale)}
.results-list{text-align:left;margin:20px 0;max-height:300px;overflow-y:auto}
.res-item{padding:9px 13px;border-radius:10px;margin-bottom:6px;font-size:.85rem}
.res-item.ok{background:var(--lime-pale)}
.res-item.ko{background:var(--coral-pale)}
.res-q{font-weight:600;margin-bottom:2px}
.res-a{color:var(--muted);font-size:.78rem}

/* attempt badge */
.attempt-banner{background:var(--amber-pale);border:2px solid #fde68a;border-radius:var(--radius-sm);padding:10px 14px;font-size:.85rem;font-weight:600;color:#92400e;margin-bottom:14px;text-align:center}

/* ═══════════════════════════════ UTILITIES ══════════════════════════════ */
.mt8{margin-top:8px}
.txt-muted{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ══════════════════════════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════════════════════════

const TOPICS = [
  {id:"u5_voc",unit:5,name:"Story genres & narrative elements",type:"Vocabulary"},
  {id:"u5_gram",unit:5,name:"Relative clauses",type:"Grammar"},
  {id:"u6_voc",unit:6,name:"Extreme adjectives & make/do",type:"Vocabulary"},
  {id:"u6_gram",unit:6,name:"Passive voice & causative",type:"Grammar"},
  {id:"u7_voc",unit:7,name:"Phrasal verbs & personality",type:"Vocabulary"},
  {id:"u7_gram",unit:7,name:"Let/make, used to, allowed to",type:"Grammar"},
  {id:"u8_voc",unit:8,name:"Crime & reporting verbs",type:"Vocabulary"},
  {id:"u8_gram",unit:8,name:"Reported speech",type:"Grammar"},
  {id:"u9_voc",unit:9,name:"Mystery & go expressions",type:"Vocabulary"},
  {id:"u9_gram",unit:9,name:"Modal deductions",type:"Grammar"},
  {id:"u10_voc",unit:10,name:"Work, shopping & fluency",type:"Vocabulary"},
  {id:"u10_gram",unit:10,name:"Future continuous & perfect",type:"Grammar"},
];

// Question types:
//  mc     = multiple choice (opciones[], correcta)
//  fill   = fill-in-the-blank (correcta = string, alternativas[] for wrong opts shown)
//  odd    = odd one out (opciones[], correcta)
//  match  = match left→right (pairs:[{left,right}], distractors:[])
//  correct= choose correct word (opciones[2], correcta)
//  cat    = categorise words (categories:{A:[],B:[]}, words:[])
//  error  = find/correct the error (opciones[], correcta)

const Q = [
// ─────────────────────── UNIT 5 VOC ──────────────────────────────
{id:1,tema:"u5_voc",tipo:"mc",nivel:1,
 texto:"A book about aliens and spaceships is a ___.",
 opciones:["crime novel","science fiction","autobiography"],correcta:"science fiction",
 pista:"Think: what genre deals with space and the future?",
 explicacion:"<b>Science fiction</b> trata del futuro, el espacio y la tecnología. <i>Autobiography</i> es la historia de la vida real del autor."},

{id:2,tema:"u5_voc",tipo:"mc",nivel:1,
 texto:"The bad character who creates problems in the story is called the ___.",
 opciones:["hero","villain","setting"],correcta:"villain",
 pista:"Opposite of hero.",
 explicacion:"El <b>villain</b> es el malo. El <i>hero</i> es el bueno y el <i>setting</i> es el lugar donde ocurre la historia."},

{id:3,tema:"u5_voc",tipo:"mc",nivel:1,
 texto:"The location and time period of a story is called the ___.",
 opciones:["plot","dialogue","setting"],correcta:"setting",
 pista:"Where and when does the story take place?",
 explicacion:"El <b>setting</b> es el lugar y la época. El <i>plot</i> son los eventos y el <i>dialogue</i> son las conversaciones."},

{id:4,tema:"u5_voc",tipo:"mc",nivel:1,
 texto:"The events that happen in a story form the ___.",
 opciones:["character","plot","opening"],correcta:"plot",
 pista:"Think: the sequence of events in a story.",
 explicacion:"El <b>plot</b> es la trama. El <i>character</i> es un personaje y el <i>opening</i> es el comienzo."},

{id:5,tema:"u5_voc",tipo:"correct",nivel:1,
 texto:"The beginning of the story, where characters are introduced, is called the ___.",
 opciones:["ending","opening"],correcta:"opening",
 pista:"Beginning = ___ing",
 explicacion:"El <b>opening</b> es el comienzo de la historia. El <i>ending</i> es el final."},

{id:6,tema:"u5_voc",tipo:"mc",nivel:2,
 texto:"To encourage someone to keep telling a story, you say: '_____, tell me more.'",
 opciones:["Come on","Go on","Keep on"],correcta:"Go on",
 pista:"It's a fixed expression: 'Go ___, tell me more.'",
 explicacion:"La expresión fija es '<b>Go on</b>, tell me more'. 'Come on' significa 'vamos' pero no se usa en esta expresión."},

{id:7,tema:"u5_voc",tipo:"error",nivel:2,
 texto:"Which sentence is INCORRECT?",
 opciones:["You will never believe what happened.","You will never believe what happened to me.","You will never think what happened."],correcta:"You will never think what happened.",
 pista:"We don't 'think' something happened — we 'believe' it.",
 explicacion:"La expresión correcta usa <b>believe</b>, no <i>think</i>. 'You will never believe what happened (to me).'"},

{id:8,tema:"u5_voc",tipo:"mc",nivel:1,
 texto:"A book written by a famous person about their own life is an ___.",
 opciones:["historical novel","horror story","autobiography"],correcta:"autobiography",
 pista:"Auto = self, bio = life.",
 explicacion:"<b>Autobiography</b> es cuando alguien escribe la historia de su propia vida."},

{id:9,tema:"u5_voc",tipo:"odd",nivel:2,
 texto:"Which word is the ODD ONE OUT? (not a narrative element)",
 opciones:["plot","villain","salary"],correcta:"salary",
 pista:"Which word belongs to a different topic — jobs, not stories?",
 explicacion:"<b>Salary</b> es vocabulario de trabajo. <i>Plot</i> y <i>villain</i> son elementos narrativos."},

{id:10,tema:"u5_voc",tipo:"mc",nivel:2,
 texto:"In a horror story, the mysterious old house is the ___.",
 opciones:["plot","dialogue","setting"],correcta:"setting",
 pista:"The old house is the location of the story.",
 explicacion:"El <b>setting</b> es el lugar donde ocurre la historia. Una casa misteriosa es el setting perfecto para una historia de terror."},

// ─────────────────────── UNIT 5 GRAM ─────────────────────────────
{id:11,tema:"u5_gram",tipo:"mc",nivel:1,
 texto:"'The boy _____ broke my phone has to pay for it.'",
 opciones:["who","which","whose"],correcta:"who",
 pista:"The boy is a person → use ___",
 explicacion:"Usamos '<b>who</b>' para personas. 'Which' es para cosas y 'whose' indica posesión."},

{id:12,tema:"u5_gram",tipo:"mc",nivel:1,
 texto:"'This is the book _____ I borrowed from the library.'",
 opciones:["who","which","whose"],correcta:"which",
 pista:"A book is a thing → use ___",
 explicacion:"Usamos '<b>which</b>' (o 'that') para cosas, no personas."},

{id:13,tema:"u5_gram",tipo:"mc",nivel:2,
 texto:"'The girl _____ bag I found lives on my street.'",
 opciones:["who","which","whose"],correcta:"whose",
 pista:"'_____ bag' = the bag belonging to the girl",
 explicacion:"Usamos '<b>whose</b>' para indicar posesión (el bolso de la chica = her bag)."},

{id:14,tema:"u5_gram",tipo:"mc",nivel:2,
 texto:"'The school _____ I study is very old.'",
 opciones:["which","where","who"],correcta:"where",
 pista:"A school is a place → use ___",
 explicacion:"Usamos '<b>where</b>' para lugares. Podríamos decir 'which I study at' pero 'where' es más natural."},

{id:15,tema:"u5_gram",tipo:"error",nivel:2,
 texto:"Find the mistake: 'The man, that lives next door, is my uncle.'",
 opciones:["The man, who lives next door, is my uncle.","The man, which lives next door, is my uncle.","No mistake"],correcta:"The man, who lives next door, is my uncle.",
 pista:"Non-defining clauses (with commas) cannot use 'that'.",
 explicacion:"En las cláusulas <b>non-defining</b> (con comas) no se puede usar 'that'. Hay que usar '<b>who</b>' para personas."},

{id:16,tema:"u5_gram",tipo:"mc",nivel:3,
 texto:"'I missed the bus, _____ made me late for school.'",
 opciones:["that","which","who"],correcta:"which",
 pista:"The pronoun refers to the whole idea of missing the bus.",
 explicacion:"Cuando el pronombre relativo se refiere a una idea completa (perder el bus), usamos '<b>which</b>', nunca 'that'."},

{id:17,tema:"u5_gram",tipo:"correct",nivel:2,
 texto:"'My mum, ___ is a doctor, works long hours.' (non-defining)",
 opciones:["which","who"],correcta:"who",
 pista:"My mum is a person → use ___",
 explicacion:"En cláusulas <b>non-defining</b> usamos '<b>who</b>' para personas, nunca 'which' o 'that'."},

{id:18,tema:"u5_gram",tipo:"mc",nivel:2,
 texto:"'The restaurant _____ we had dinner last year has closed.'",
 opciones:["where","which","who"],correcta:"where",
 pista:"A restaurant is a place.",
 explicacion:"El restaurante es un lugar, así que usamos '<b>where</b>'."},

// ─────────────────────── UNIT 6 VOC ──────────────────────────────
{id:19,tema:"u6_voc",tipo:"mc",nivel:1,
 texto:"'The food was absolutely _____ – I ate everything!'",
 opciones:["delicious","very good","big"],correcta:"delicious",
 pista:"With 'absolutely' you need an EXTREME adjective.",
 explicacion:"Con 'absolutely' usamos adjetivos extremos como '<b>delicious</b>'. No se puede decir 'absolutely very good'."},

{id:20,tema:"u6_voc",tipo:"error",nivel:2,
 texto:"Which sentence is INCORRECT?",
 opciones:["She is absolutely hilarious.","She is very hilarious.","She is really funny."],correcta:"She is very hilarious.",
 pista:"'Hilarious' is an extreme adjective. Which modifier is wrong?",
 explicacion:"'<b>Hilarious</b>' es extremo. No puede ir con 'very'. Usa 'absolutely hilarious' o 'really hilarious'."},

{id:21,tema:"u6_voc",tipo:"mc",nivel:1,
 texto:"'It's -5°C outside. It's absolutely _____.'",
 opciones:["cold","freezing","cool"],correcta:"freezing",
 pista:"What is the EXTREME version of 'cold'?",
 explicacion:"'<b>Freezing</b>' es el adjetivo extremo de 'cold'. Con 'absolutely' siempre necesitamos adjetivos extremos."},

{id:22,tema:"u6_voc",tipo:"correct",nivel:1,
 texto:"'In Chemistry today we are going to ___ an experiment.'",
 opciones:["make","do"],correcta:"do",
 pista:"do/make + experiment?",
 explicacion:"La colocación correcta es '<b>do an experiment</b>'. 'Make' no se usa con 'experiment'."},

{id:23,tema:"u6_voc",tipo:"correct",nivel:1,
 texto:"'Does that ___ sense?'",
 opciones:["do","make"],correcta:"make",
 pista:"It's a fixed expression: ___ sense",
 explicacion:"La expresión fija es '<b>make sense</b>'. 'Do sense' no existe en inglés."},

{id:24,tema:"u6_voc",tipo:"correct",nivel:1,
 texto:"'I hope you ___ well in your exams.'",
 opciones:["make","do"],correcta:"do",
 pista:"do/make + well?",
 explicacion:"La expresión correcta es '<b>do well</b>'. 'Made well' no existe."},

{id:25,tema:"u6_voc",tipo:"correct",nivel:2,
 texto:"'When I grow up, I want to ___ a lot of money.'",
 opciones:["do","make"],correcta:"make",
 pista:"do/make + money?",
 explicacion:"La expresión correcta es '<b>make money</b>'. 'Do money' no existe en inglés."},

{id:26,tema:"u6_voc",tipo:"odd",nivel:2,
 texto:"Which adjective is NOT an extreme adjective?",
 opciones:["hilarious","freezing","cold"],correcta:"cold",
 pista:"Which one could go with 'very'?",
 explicacion:"'<b>Cold</b>' es ordinario (puede ir con 'very'). Su versión extrema es 'freezing'. <i>Hilarious</i> y <i>freezing</i> son extremos."},

// ─────────────────────── UNIT 6 GRAM ─────────────────────────────
{id:27,tema:"u6_gram",tipo:"mc",nivel:1,
 texto:"Transform: 'The police arrested the thief.' → Passive: '_____ by the police.'",
 opciones:["The thief was arrested","The thief is arrested","The thief arrested"],correcta:"The thief was arrested",
 pista:"Past passive: subject + WAS/WERE + past participle",
 explicacion:"Pasiva de pasado: sujeto + <b>WAS/WERE + participio</b>. 'Arrest' → 'arrested'."},

{id:28,tema:"u6_gram",tipo:"mc",nivel:1,
 texto:"'English _____ all over the world.' (present passive)",
 opciones:["is spoken","is speaking","speaks"],correcta:"is spoken",
 pista:"Present passive: is/are + past participle",
 explicacion:"Pasiva de presente: <b>is/are + participio</b>. 'Speak' → participio 'spoken'."},

{id:29,tema:"u6_gram",tipo:"mc",nivel:2,
 texto:"Causative: 'I went to a hairdresser.' → 'I _____.'",
 opciones:["had my hair cut","did my hair cut","made my hair cut"],correcta:"had my hair cut",
 pista:"Causative = HAVE + object + past participle",
 explicacion:"La causativa es <b>HAVE + objeto + participio</b>: 'have my hair cut'. Otra persona lo hizo por ti."},

{id:30,tema:"u6_gram",tipo:"mc",nivel:2,
 texto:"'The concert _____ next Saturday.' (future passive)",
 opciones:["will be held","will hold","is held"],correcta:"will be held",
 pista:"Future passive: will be + past participle",
 explicacion:"Pasiva de futuro: <b>will be + participio</b>. 'Hold' → participio 'held'."},

{id:31,tema:"u6_gram",tipo:"error",nivel:3,
 texto:"Find the mistake: 'By 2030, scientists will be cured cancer.'",
 opciones:["will have cured cancer","will cure cancer","No mistake"],correcta:"will have cured cancer",
 pista:"'By 2030' → action completed before a future point → future ___",
 explicacion:"'By 2030' indica antes de un punto futuro → <b>future perfect</b>: 'will have cured'. 'Will be curing' sería future continuous."},

{id:32,tema:"u6_gram",tipo:"mc",nivel:3,
 texto:"'They have built a new school.' → Present perfect passive:",
 opciones:["A new school has been built.","A new school was built.","A new school is built."],correcta:"A new school has been built.",
 pista:"Pres. perf. passive: has/have + been + past participle",
 explicacion:"Present perfect pasivo: <b>has/have + been + participio</b>."},

// ─────────────────────── UNIT 7 VOC ──────────────────────────────
{id:33,tema:"u7_voc",tipo:"mc",nivel:1,
 texto:"'Stop doing something' → which phrasal verb?",
 opciones:["give up","take up","set off"],correcta:"give up",
 pista:"Think of giving something away — giving it up.",
 explicacion:"'<b>Give up</b>' = dejar de hacer algo. 'Take up' = empezar algo nuevo y 'set off' = comenzar un viaje."},

{id:34,tema:"u7_voc",tipo:"mc",nivel:1,
 texto:"'I am going to _____ salsa dancing. I start next week!'",
 opciones:["give up","take up","end up"],correcta:"take up",
 pista:"She's starting a new hobby.",
 explicacion:"'<b>Take up</b>' = empezar una nueva actividad o hobby. 'Give up' es dejarlo — lo contrario."},

{id:35,tema:"u7_voc",tipo:"mc",nivel:2,
 texto:"'After travelling for two days, we _____ in the wrong town!'",
 opciones:["set off","showed up","ended up"],correcta:"ended up",
 pista:"They were in a final (unexpected) destination.",
 explicacion:"'<b>End up</b>' = terminar en un lugar o situación, a menudo sin haberlo planeado."},

{id:36,tema:"u7_voc",tipo:"mc",nivel:2,
 texto:"'What time did Helen _____ to the party?'",
 opciones:["set off","show up","carry on"],correcta:"show up",
 pista:"She arrived (perhaps late or unexpectedly).",
 explicacion:"'<b>Show up</b>' = aparecer o llegar. 'Set off' es partir, lo opuesto."},

{id:37,tema:"u7_voc",tipo:"odd",nivel:1,
 texto:"Which is the ODD ONE OUT? (not a positive personality adjective)",
 opciones:["warm","friendly","cold"],correcta:"cold",
 pista:"Which one describes someone unfriendly or distant?",
 explicacion:"'<b>Cold</b>' (frío, distante) es negativo. <i>Warm</i> (cálido) y <i>friendly</i> son positivos."},

{id:38,tema:"u7_voc",tipo:"odd",nivel:1,
 texto:"Which is the ODD ONE OUT? (the positive word among negatives)",
 opciones:["unfriendly","generous","rude"],correcta:"generous",
 pista:"Which word describes a good quality?",
 explicacion:"'<b>Generous</b>' (generoso) es positivo. <i>Unfriendly</i> y <i>rude</i> (maleducado) son negativos."},

{id:39,tema:"u7_voc",tipo:"mc",nivel:1,
 texto:"Daniel gives presents to everyone. He is very ___.",
 opciones:["selfish","generous","rude"],correcta:"generous",
 pista:"Opposite of selfish.",
 explicacion:"'<b>Generous</b>' = alguien que da y comparte. '<i>Selfish</i>' es lo contrario (egoísta)."},

{id:40,tema:"u7_voc",tipo:"mc",nivel:2,
 texto:"'He plays video games ___. He never takes a break!'",
 opciones:["after all","all the time","first of all"],correcta:"all the time",
 pista:"It means 'constantly' or 'always'.",
 explicacion:"'<b>All the time</b>' = siempre o constantemente."},

{id:41,tema:"u7_voc",tipo:"mc",nivel:2,
 texto:"'Welcome to my presentation! _____, let me introduce myself.'",
 opciones:["After all","All the same","First of all"],correcta:"First of all",
 pista:"You're about to make your first point.",
 explicacion:"'<b>First of all</b>' = en primer lugar. Se usa para introducir el primer punto."},

{id:42,tema:"u7_voc",tipo:"mc",nivel:2,
 texto:"'I love sports. _____, my mum is a professional tennis player.'",
 opciones:["First of all","After all","All the same"],correcta:"After all",
 pista:"It explains WHY the previous statement makes sense.",
 explicacion:"'<b>After all</b>' = al fin y al cabo, teniendo en cuenta las circunstancias."},

// ─────────────────────── UNIT 7 GRAM ─────────────────────────────
{id:43,tema:"u7_gram",tipo:"mc",nivel:1,
 texto:"'My parents _____ me stay up late on Fridays.' (permission)",
 opciones:["make","let","force"],correcta:"let",
 pista:"Permission → let/allow. Obligation → make.",
 explicacion:"'<b>Let</b>' + persona + infinitivo (sin 'to') = permiso. 'Make' = obligación."},

{id:44,tema:"u7_gram",tipo:"mc",nivel:1,
 texto:"'The teacher _____ us do 50 exercises!' (obligation)",
 opciones:["let","made","allowed"],correcta:"made",
 pista:"Someone FORCED you to do it.",
 explicacion:"'<b>Make</b>' + persona + infinitivo = obligación (alguien te obliga)."},

{id:45,tema:"u7_gram",tipo:"mc",nivel:2,
 texto:"'Students _____ use their phones during exams.'",
 opciones:["aren't allowed to","don't let","aren't let to"],correcta:"aren't allowed to",
 pista:"Passive form of permission: be allowed to",
 explicacion:"'<b>Be allowed to</b>' = tener/no tener permiso. 'Let' no se usa con 'to' así."},

{id:46,tema:"u7_gram",tipo:"error",nivel:2,
 texto:"Find the mistake: 'They made me to do the homework.'",
 opciones:["They made me do the homework.","They made me doing the homework.","No mistake"],correcta:"They made me do the homework.",
 pista:"After make/let, the verb is ALWAYS bare infinitive (no 'to').",
 explicacion:"Con '<b>make</b>' y '<b>let</b>' el verbo siguiente va SIN 'to': 'made me do', no 'made me to do'."},

{id:47,tema:"u7_gram",tipo:"mc",nivel:2,
 texto:"'I am _____ to getting up early. I still find it hard!'",
 opciones:["not used","used","getting used"],correcta:"not used",
 pista:"She HASN'T adapted yet.",
 explicacion:"'<b>Not used to + -ing</b>' = todavía no te has adaptado. 'Getting used to' = proceso en progreso."},

{id:48,tema:"u7_gram",tipo:"mc",nivel:2,
 texto:"'I'm slowly _____ used to living in Madrid.'",
 opciones:["getting","being","making"],correcta:"getting",
 pista:"Process of adapting → GET used to",
 explicacion:"'<b>Get used to + -ing</b>' = proceso de adaptarse a algo nuevo. 'Be used to' = ya adaptado."},

{id:49,tema:"u7_gram",tipo:"error",nivel:3,
 texto:"Find the mistake: 'I'm not used to live in a small apartment.'",
 opciones:["I'm not used to living in a small apartment.","I'm not used to lived in a small apartment.","No mistake"],correcta:"I'm not used to living in a small apartment.",
 pista:"After 'used to' (adaptation), the verb ends in -ing.",
 explicacion:"'Used to' de adaptación siempre va seguido de <b>-ing</b>: 'used to living'. El 'to' aquí es preposición, no infinitivo."},

// ─────────────────────── UNIT 8 VOC ──────────────────────────────
{id:50,tema:"u8_voc",tipo:"mc",nivel:1,
 texto:"Someone who steals money from a bank is a ___.",
 opciones:["robber","burglar","pickpocket"],correcta:"robber",
 pista:"They target BANKS.",
 explicacion:"Un <b>robber</b> roba en bancos. Un <i>burglar</i> entra en casas y un <i>pickpocket</i> roba carteras."},

{id:51,tema:"u8_voc",tipo:"mc",nivel:1,
 texto:"Someone who breaks into a house to steal is a ___.",
 opciones:["mugger","burglar","con man"],correcta:"burglar",
 pista:"They 'break into' HOUSES.",
 explicacion:"Un <b>burglar</b> entra en casas. Un <i>mugger</i> ataca a personas en la calle."},

{id:52,tema:"u8_voc",tipo:"mc",nivel:1,
 texto:"Someone who steals your wallet from your pocket without you noticing is a ___.",
 opciones:["shoplifter","murderer","pickpocket"],correcta:"pickpocket",
 pista:"They steal from your POCKET.",
 explicacion:"Un <b>pickpocket</b> roba de bolsillos sin que te des cuenta."},

{id:53,tema:"u8_voc",tipo:"mc",nivel:1,
 texto:"Someone who takes things from shops without paying is a ___.",
 opciones:["shoplifter","poacher","robber"],correcta:"shoplifter",
 pista:"They steal from SHOPS.",
 explicacion:"Un <b>shoplifter</b> roba en tiendas. Un <i>poacher</i> caza ilegalmente."},

{id:54,tema:"u8_voc",tipo:"mc",nivel:1,
 texto:"Someone who hunts wild animals illegally is a ___.",
 opciones:["con man","poacher","mugger"],correcta:"poacher",
 pista:"They hunt animals illegally → ___ching",
 explicacion:"Un <b>poacher</b> (cazador furtivo) caza animales de forma ilegal."},

{id:55,tema:"u8_voc",tipo:"mc",nivel:1,
 texto:"Someone who attacks you in the street to steal your money is a ___.",
 opciones:["burglar","mugger","shoplifter"],correcta:"mugger",
 pista:"They MUG you — attack you physically.",
 explicacion:"Un <b>mugger</b> ataca físicamente en la calle."},

{id:56,tema:"u8_voc",tipo:"correct",nivel:1,
 texto:"'The criminal had to pay a ___.' (penalty in money)",
 opciones:["murder","fine"],correcta:"fine",
 pista:"A money penalty = a ___",
 explicacion:"<b>Fine</b> = multa (penalización económica). <i>Murder</i> es asesinato."},

{id:57,tema:"u8_voc",tipo:"correct",nivel:1,
 texto:"'Harry ___ his first crime when he was 14.'",
 opciones:["caught","committed"],correcta:"committed",
 pista:"You ___ a crime (not catch it).",
 explicacion:"La colocación correcta es '<b>commit a crime</b>'. 'Caught' = ser atrapado/a."},

{id:58,tema:"u8_voc",tipo:"mc",nivel:2,
 texto:"'Betty _____ me to dress up as a clown for the party.'",
 opciones:["suggested","persuaded","refused"],correcta:"persuaded",
 pista:"She convinced you to do something you might not have wanted to.",
 explicacion:"'<b>Persuade someone to do</b>' = convencer. 'Suggest' va con -ing."},

{id:59,tema:"u8_voc",tipo:"mc",nivel:1,
 texto:"'The doctor _____ doing 20 minutes of exercise a day.'",
 opciones:["recommended","refused","claimed"],correcta:"recommended",
 pista:"The doctor gave advice → ___mended doing",
 explicacion:"'<b>Recommend + -ing</b>' = recomendar. Va seguido de -ing, nunca de infinitivo."},

{id:60,tema:"u8_voc",tipo:"mc",nivel:2,
 texto:"'He _____ that he didn't know anything about the theft.'",
 opciones:["agreed","claimed","refused"],correcta:"claimed",
 pista:"He stated it as true — it might or might not be.",
 explicacion:"'<b>Claim</b>' = afirmar algo como verdadero (puede ser mentira)."},

{id:61,tema:"u8_voc",tipo:"mc",nivel:1,
 texto:"'She _____ to help me. She said she was too busy.'",
 opciones:["refused","offered","agreed"],correcta:"refused",
 pista:"She said NO.",
 explicacion:"'<b>Refuse to do</b>' = negarse. 'Agreed' = aceptar — lo opuesto."},

{id:62,tema:"u8_voc",tipo:"mc",nivel:1,
 texto:"'Paul _____ Meryl to dinner.'",
 opciones:["claimed","invited","refused"],correcta:"invited",
 pista:"He asked her to come somewhere with him.",
 explicacion:"'<b>Invite someone to somewhere</b>' = invitar."},

{id:63,tema:"u8_voc",tipo:"mc",nivel:2,
 texto:"'She _____ going to the museum to do research.'",
 opciones:["refused","suggested","persuaded"],correcta:"suggested",
 pista:"Suggest + ___ing (not infinitive).",
 explicacion:"'<b>Suggest + -ing</b>' = sugerir. Va seguido de -ing, no de infinitivo."},

{id:64,tema:"u8_voc",tipo:"odd",nivel:2,
 texto:"ODD ONE OUT: not a type of criminal",
 opciones:["robber","pickpocket","claimed"],correcta:"claimed",
 pista:"Which one is a verb, not a person?",
 explicacion:"'<b>Claimed</b>' es un reporting verb. <i>Robber</i> y <i>pickpocket</i> son tipos de criminales."},

{id:65,tema:"u8_voc",tipo:"odd",nivel:2,
 texto:"ODD ONE OUT: not a reporting verb",
 opciones:["agreed","burglar","suggested"],correcta:"burglar",
 pista:"Which one is a noun — a type of person?",
 explicacion:"'<b>Burglar</b>' es un criminal. <i>Agreed</i> y <i>suggested</i> son reporting verbs."},

// ─────────────────────── UNIT 8 GRAM ─────────────────────────────
{id:66,tema:"u8_gram",tipo:"mc",nivel:1,
 texto:"He said, 'I am tired.' → Reported: He said ___",
 opciones:["he was tired.","he is tired.","he were tired."],correcta:"he was tired.",
 pista:"Present simple → past simple in reported speech.",
 explicacion:"En reported speech: presente simple (am) → pasado simple (was). '<b>I am</b>' → '<b>he was</b>'."},

{id:67,tema:"u8_gram",tipo:"mc",nivel:2,
 texto:"She said, 'I will call you tomorrow.' → Reported: She said ___",
 opciones:["she would call me the next day.","she will call me tomorrow.","she called me the next day."],correcta:"she would call me the next day.",
 pista:"will → ___ in reported speech. tomorrow → ___",
 explicacion:"'<b>Will</b>' → '<b>would</b>' en reported speech. 'Tomorrow' → 'the next day'."},

{id:68,tema:"u8_gram",tipo:"mc",nivel:1,
 texto:"'She _____ me when the film started.' (indirect question)",
 opciones:["asked","said","told"],correcta:"asked",
 pista:"It's a question → use ask, not say/tell.",
 explicacion:"Usamos '<b>ask</b>' para preguntas indirectas. 'Tell' necesita objeto y 'say' no lleva objeto."},

{id:69,tema:"u8_gram",tipo:"mc",nivel:2,
 texto:"'Don't touch my phone!' → Reported: She told me ___",
 opciones:["not to touch her phone.","to not touch her phone.","don't touch her phone."],correcta:"not to touch her phone.",
 pista:"Negative order: told + not to + infinitive",
 explicacion:"Órdenes negativas en reported speech: '<b>told + not to + infinitivo</b>'."},

{id:70,tema:"u8_gram",tipo:"mc",nivel:2,
 texto:"'He _____ to go home immediately.' (he demanded it)",
 opciones:["claimed","demanded","suggested"],correcta:"demanded",
 pista:"A STRONG requirement → demand to",
 explicacion:"'<b>Demand to</b>' = exigir algo. 'Suggest + -ing' y 'claim' son diferentes."},

{id:71,tema:"u8_gram",tipo:"mc",nivel:2,
 texto:"'Do you like horror films?' → She asked me ___",
 opciones:["if I liked horror films.","if I like horror films.","do I like horror films."],correcta:"if I liked horror films.",
 pista:"Yes/no questions → if/whether + past tense",
 explicacion:"Preguntas sí/no en reported speech: '<b>if/whether</b>' + pasado. 'Like' → 'liked'."},

{id:72,tema:"u8_gram",tipo:"error",nivel:2,
 texto:"Find the mistake: 'She said me that she was happy.'",
 opciones:["She said that she was happy.","She said to me that she was happy.","No mistake"],correcta:"She said that she was happy.",
 pista:"'Say' doesn't take a personal object directly.",
 explicacion:"'<b>Say</b>' no lleva objeto de persona. Decimos 'said that...' o 'told me that...', nunca 'said me'."},

{id:73,tema:"u8_gram",tipo:"mc",nivel:2,
 texto:"'I can't help you.' → He said ___",
 opciones:["he couldn't help me.","he can't help me.","he could help me."],correcta:"he couldn't help me.",
 pista:"can → ___ in reported speech",
 explicacion:"'<b>Can</b>' → '<b>could</b>' en reported speech. 'You' → 'me'."},

{id:74,tema:"u8_gram",tipo:"mc",nivel:3,
 texto:"'He _____ me to study harder.' (he motivated me)",
 opciones:["suggested","encouraged","claimed"],correcta:"encouraged",
 pista:"He motivated you → encourage someone to do",
 explicacion:"'<b>Encourage someone to do</b>' = animar a alguien."},

{id:75,tema:"u8_gram",tipo:"mc",nivel:3,
 texto:"'They were investigating the case.' → Police said they ___",
 opciones:["were investigating","are investigating","would investigate"],correcta:"were investigating",
 pista:"Present continuous → past continuous in reported speech",
 explicacion:"Present continuous ('are investigating') → pasado continuo '<b>were investigating</b>' en reported speech."},

// ─────────────────────── UNIT 9 VOC ──────────────────────────────
{id:76,tema:"u9_voc",tipo:"mc",nivel:1,
 texto:"'The origin of this object is unknown. It's _____.'",
 opciones:["odd","unexplained","secret"],correcta:"unexplained",
 pista:"No explanation exists for it.",
 explicacion:"'<b>Unexplained</b>' = sin explicación conocida."},

{id:77,tema:"u9_voc",tipo:"mc",nivel:1,
 texto:"'A being from another planet is called an _____.'",
 opciones:["alien","odd","mysterious"],correcta:"alien",
 pista:"Another planet → alien / ___terrestrial",
 explicacion:"Un '<b>alien</b>' es un ser de otro planeta."},

{id:78,tema:"u9_voc",tipo:"mc",nivel:1,
 texto:"'That video my friend posted _____ within an hour!'",
 opciones:["went up","went viral","went crazy"],correcta:"went viral",
 pista:"Shared by millions online → go ___",
 explicacion:"'<b>Go viral</b>' = hacerse viral en internet."},

{id:79,tema:"u9_voc",tipo:"mc",nivel:1,
 texto:"'The fans _____ when the singer came on stage!'",
 opciones:["went up","went viral","went crazy"],correcta:"went crazy",
 pista:"They were extremely excited.",
 explicacion:"'<b>Go crazy</b>' = ponerse muy emocionado o perder la cabeza de entusiasmo."},

{id:80,tema:"u9_voc",tipo:"mc",nivel:1,
 texto:"'Prices have definitely _____. Everything costs more!'",
 opciones:["gone viral","gone up","gone crazy"],correcta:"gone up",
 pista:"Prices INCREASED.",
 explicacion:"'<b>Go up</b>' = subir o aumentar."},

{id:81,tema:"u9_voc",tipo:"mc",nivel:2,
 texto:"'He _____ writing until the very end of the exam.'",
 opciones:["went up","went on","went viral"],correcta:"went on",
 pista:"He continued → go ___",
 explicacion:"'<b>Go on</b>' = continuar haciendo algo."},

  if(q.tipo==='mc'||q.tipo==='odd'||q.tipo==='error'){
    const letters=['A','B','C','D'];
    body=`<div class="opts">${qsh.opciones.map((o,i)=>{
      let cls='opt';
      if(answered){if(o===q.correcta)cls+=' correct';else if(o===userAns&&o!==q.correcta)cls+=' wrong';}
      return `<button class="${cls}" data-a="${actionKey}" data-opt="${o}" ${answered?'disabled':''}>
        <span class="opt-letter">${letters[i]}</span>${o}</button>`;
    }).join('')}</div>`;
  } else if(q.tipo==='correct'){
    const letters=['A','B'];
    body=`<div class="opts">${q.opciones.map((o,i)=>{
      let cls='opt';
      if(answered){if(o===q.correcta)cls+=' correct';else if(o===userAns&&o!==q.correcta)cls+=' wrong';}
      return `<button class="${cls}" data-a="${actionKey}" data-opt="${o}" ${answered?'disabled':''}>
        <span class="opt-letter">${letters[i]}</span>${o}</button>`;
    }).join('')}</div>`;
  }

  let fb='';
  if(answered){
    const ok=userAns===q.correcta;
    fb=ok
      ? `<div class="feedback ok">✅ Correct! <b>${q.correcta}</b> is the right answer.</div>`
      : `<div class="feedback err">❌ The correct answer is <b>${q.correcta}</b>. ${q.explicacion}</div>`;
  }

  const hintBtn = !answered && q.pista
    ? `<button class="q-hint-btn" data-a="toggleHint">💡 Hint</button>` : '';

  const action = answered
    ? `<div class="act-row"><button class="btn-next" data-a="${nextLabel}">${nextLabel==='practiceNext'?'Next question →':nextLabel==='diagNext'?'Next →':nextLabel==='finalNext'?'Next →':'Next →'}</button>${nextLabel==='practiceNext'?`<button class="btn-sec" data-a="topicPicker">Change topic</button>`:''}</div>`
    : '';

  return `
  ${headerHTML}
  ${progressHTML}
  ${statsHTML||''}
  <div class="q-card">
    <div class="q-top">
      <div class="q-badges">
        <span class="badge badge-type">${typeLabel(q.tipo)}</span>
        <span class="badge badge-unit">Unit ${q.tema.replace('u','').replace('_voc','').replace('_gram','')}</span>
        <span class="badge ${lvlBadge(q.nivel)}">${lvlLabel(q.nivel)}</span>
      </div>
      ${hintBtn}
    </div>
    ${hint}
    <div class="q-text">${q.texto}</div>
    ${body}
    ${fb}
    ${action}
  </div>`;
}

// ── PRACTICE ─────────────────────────────────────────────────────
function rPractice(){
  const q=S.pqueue[S.pidx%S.pqueue.length];
  const t=TOPICS.find(t=>t.id===S.ptopic);
  const num=(S.pidx%S.pqueue.length)+1;
  const hdr=`<div class="sec-hdr"><button class="btn-back" data-a="topicPicker">← Topics</button><h2>Unit ${t.unit} · ${t.name}</h2></div>`;
  const prog=`<div class="prog-wrap"><div class="prog-top"><span>Question ${num} of ${S.pqueue.length}</span><span>${t.type}</span></div></div>`;
  return rQuestion(q,S.pans,S.pusr,'practiceAnswer','practiceNext',prog,hdr,'');
}

// ── DIAGNOSTIC ───────────────────────────────────────────────────
function rDiag(){
  const q=S.dqs[S.didx];
  const n=S.didx+1,total=S.dqs.length,pct=Math.round((n-1)/total*100);
  const attempt=S.dattempt>0?`<div class="attempt-banner">Attempt ${S.dattempt+1} – No pressure! You've got this 💪</div>`:'';
  const hdr=`${attempt}<div class="sec-hdr"><button class="btn-back" data-a="home">← Home</button><h2>🔍 Diagnostic Test</h2></div>`;
  const prog=`<div class="prog-wrap"><div class="prog-top"><span>Question ${n} of ${total}</span><span>${pct}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>`;
  const stats=`<div class="prog-stats"><div class="stat-chip good">✅ ${S.dcorrect} correct</div><div class="stat-chip bad">❌ ${S.didx-S.dcorrect} wrong</div></div>`;
  return rQuestion(q,S.dans,S.dusr,'diagAnswer','diagNext',prog,hdr,stats);
}

// ── DIAG SCORE ────────────────────────────────────────────────────
function rDiagScore(){
  const s=S.dcorrect,t=S.dqs.length,pct=Math.round(s/t*100);
  const passed=s>=10;
  const [emoji,msg,col]=passed
    ?['🎉','Great job! You\'ve passed the diagnostic test. Ready for the final exam?','var(--lime)']
    :['💪','You need a bit more practice. Don\'t worry — try again with different questions.','var(--amber)'];
  const actions=passed
    ?`<button class="btn-prim" data-a="startFinal">Go to Final Exam 🏆</button><button class="btn-outline" data-a="home">Home</button>`
    :`<button class="btn-prim" data-a="retryDiag">New diagnostic →</button><button class="btn-outline" data-a="topicPicker">Practise by topic</button>`;
  return `
  <div class="sec-hdr"><button class="btn-back" data-a="home">← Home</button><h2>🔍 Diagnostic Result</h2></div>
  <div class="score-card">
    <div class="score-emoji">${emoji}</div>
    <div><span class="score-num" style="color:${col}">${s}</span><span class="score-denom">/${t}</span></div>
    <div class="score-label">Attempt ${S.dattempt+1} · ${pct}%</div>
    <div class="score-meter"><div class="score-meter-fill" style="width:${pct}%;background:${col}"></div></div>
    <div class="score-msg">${msg}</div>
    ${actions}
  </div>`;
}

// ── FINAL EXAM ────────────────────────────────────────────────────
function rFinal(){
  const q=S.fqs[S.fidx];
  const n=S.fidx+1,total=S.fqs.length,pct=Math.round((n-1)/total*100);
  const hdr=`<div class="sec-hdr"><button class="btn-back" data-a="home">← Home</button><h2>🏆 Final Exam</h2></div>`;
  const prog=`<div class="prog-wrap"><div class="prog-top"><span>Question ${n} of ${total}</span><span>${pct}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>`;
  const stats=`<div class="prog-stats"><div class="stat-chip good">✅ ${S.fcorrect} correct</div><div class="stat-chip bad">❌ ${S.fidx-S.fcorrect} wrong</div></div>`;
  const nextLabel=S.fidx<total-1?'finalNext':'finalEnd';
  return rQuestion(q,S.fans,S.fusr,'finalAnswer',nextLabel,prog,hdr,stats);
}

// ── FINAL SCORE ───────────────────────────────────────────────────
function rFinalScore(){
  const s=S.fcorrect,t=S.fqs.length,pct=Math.round(s/t*100);
  let emoji,msg,col;
  if(pct<40){emoji='😓';msg='Keep practising – review the topics where you made mistakes.';col='var(--coral)';}
  else if(pct<70){emoji='🙂';msg='Good, but there is room for improvement. Check the words you got wrong.';col='var(--amber)';}
  else if(pct<90){emoji='😊';msg='Well done! You\'re getting there. Keep it up!';col='var(--teal)';}
  else{emoji='🌟';msg='Excellent! You\'ve mastered the grammar and vocabulary!';col='var(--lime)';}
  const results=S.fresults.map(r=>`<div class="res-item ${r.ok?'ok':'ko'}"><div class="res-q">${r.ok?'✅':'❌'} ${r.q}</div>${!r.ok?`<div class="res-a">✔ Correct: ${r.c}</div>`:''}</div>`).join('');
  return `
  <div class="sec-hdr"><button class="btn-back" data-a="home">← Home</button><h2>🏆 Final Exam Result</h2></div>
  <div class="score-card">
    <div class="score-emoji">${emoji}</div>
    <div><span class="score-num" style="color:${col}">${s}</span><span class="score-denom">/${t}</span></div>
    <div class="score-label">${pct}% correct</div>
    <div class="score-meter"><div class="score-meter-fill" style="width:${pct}%;background:${col}"></div></div>
    <div class="score-msg">${msg}</div>
    <button class="btn-prim" data-a="retryFinal">Retake exam 🔄</button>
    <button class="btn-outline" data-a="topicPicker">Practise by topic</button>
    <button class="btn-outline" data-a="home">Home</button>
    <div class="results-list">${results}</div>
  </div>`;
}

// ── VOCAB EXAM ────────────────────────────────────────────────────
function rVocab(){
  const q=S.vqs[S.vidx];
  const n=S.vidx+1,total=S.vqs.length,pct=Math.round((n-1)/total*100);
  const hdr=`<div class="sec-hdr"><button class="btn-back" data-a="home">← Home</button><h2>📝 Vocabulary Exam</h2></div>`;
  const prog=`<div class="prog-wrap"><div class="prog-top"><span>Question ${n} of ${total}</span><span>${pct}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>`;
  const stats=`<div class="prog-stats"><div class="stat-chip good">✅ ${S.vcorrect} correct</div><div class="stat-chip bad">❌ ${S.vidx-S.vcorrect} wrong</div></div>`;
  const nextLabel=S.vidx<total-1?'vocabNext':'vocabEnd';
  return rQuestion(q,S.vans,S.vusr,'vocabAnswer',nextLabel,prog,hdr,stats);
}

// ── VOCAB SCORE ───────────────────────────────────────────────────
function rVocabScore(){
  const s=S.vcorrect,t=S.vqs.length,pct=Math.round(s/t*100);
  let emoji,msg,col;
  if(pct<40){emoji='😓';msg='Keep practising the vocabulary!';col='var(--coral)';}
  else if(pct<70){emoji='🙂';msg='Good, but review the words you got wrong.';col='var(--amber)';}
  else{emoji='🌟';msg='Excellent vocabulary knowledge!';col='var(--lime)';}
  const results=S.vresults.map(r=>`<div class="res-item ${r.ok?'ok':'ko'}"><div class="res-q">${r.ok?'✅':'❌'} ${r.q}</div>${!r.ok?`<div class="res-a">✔ Correct: ${r.c}</div>`:''}</div>`).join('');
  return `
  <div class="sec-hdr"><button class="btn-back" data-a="home">← Home</button><h2>📝 Vocabulary Result</h2></div>
  <div class="score-card">
    <div class="score-emoji">${emoji}</div>
    <div><span class="score-num" style="color:${col}">${s}</span><span class="score-denom">/${t}</span></div>
    <div class="score-label">${pct}% correct</div>
    <div class="score-meter"><div class="score-meter-fill" style="width:${pct}%;background:${col}"></div></div>
    <div class="score-msg">${msg}</div>
    <button class="btn-prim" data-a="retryVocab">Retake 🔄</button>
    <button class="btn-outline" data-a="home">Home</button>
    <div class="results-list">${results}</div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════
//  DISPATCHER
// ══════════════════════════════════════════════════════════════════
function dispatch(e){
  const a=e.currentTarget.dataset.a;
  S.showHint=false;
  switch(a){
    case 'home': S.screen='home'; break;
    case 'topicPicker': S.screen='topicPicker'; break;
    case 'toggleHint': S.showHint=!S.showHint; render(); return;

    case 'startPractice':{
      S.ptopic=e.currentTarget.dataset.tid;
      S.pqueue=shuffle(Q.filter(q=>q.tema===S.ptopic));
      S.pidx=0;S.pans=false;S.pusr=null;S.screen='practice'; break;
    }
    case 'practiceAnswer':{
      if(S.pans)return;
      S.pusr=e.currentTarget.dataset.opt;S.pans=true; break;
    }
    case 'practiceNext':{
      S.pidx++;if(S.pidx>=S.pqueue.length){S.pqueue=shuffle(S.pqueue);S.pidx=0;}
      S.pans=false;S.pusr=null; break;
    }

    case 'startDiag': startDiag(); return;
    case 'diagAnswer':{
      if(S.dans)return;
      S.dusr=e.currentTarget.dataset.opt;
      if(S.dusr===S.dqs[S.didx].correcta)S.dcorrect++;
      S.dans=true; break;
    }
    case 'diagNext':{
      S.didx++;S.dans=false;S.dusr=null;
      if(S.didx>=S.dqs.length)S.screen='diagScore'; break;
    }
    case 'retryDiag':{S.dattempt++;startDiag();return;}

    case 'startFinal': startFinal(); return;
    case 'finalAnswer':{
      if(S.fans)return;
      S.fusr=e.currentTarget.dataset.opt;
      const q=S.fqs[S.fidx];const ok=S.fusr===q.correcta;
      if(ok)S.fcorrect++;
      S.fresults.push({q:q.texto.substring(0,55)+'…',ok,c:q.correcta});
      S.fans=true; break;
    }
    case 'finalNext':{S.fidx++;S.fans=false;S.fusr=null; break;}
    case 'finalEnd': S.screen='finalScore'; break;
    case 'retryFinal':{S.fprev=S.fqs.map(q=>q.id);startFinal();return;}

    case 'startVocab': startVocab(); return;
    case 'vocabAnswer':{
      if(S.vans)return;
      S.vusr=e.currentTarget.dataset.opt;
      const q=S.vqs[S.vidx];const ok=S.vusr===q.correcta;
      if(ok)S.vcorrect++;
      S.vresults.push({q:q.texto.substring(0,55)+'…',ok,c:q.correcta});
      S.vans=true; break;
    }
    case 'vocabNext':{S.vidx++;S.vans=false;S.vusr=null; break;}
    case 'vocabEnd': S.screen='vocabScore'; break;
    case 'retryVocab':{S.vprev=S.vqs.map(q=>q.id);startVocab();return;}
  }
  render();
}

function handleFill(e){
  const inp=document.querySelector('.fill-input');
  if(!inp)return;
  const val=inp.value.trim().toLowerCase();
  // Find active question
  const screens={diag:S.dqs[S.didx],final:S.fqs[S.fidx],vocab:S.vqs[S.vidx],practice:S.pqueue[S.pidx%S.pqueue.length]};
  const q=screens[S.screen];
  if(!q||S.dans||S.fans||S.vans||S.pans)return;
  const ok=val===q.correcta.toLowerCase();
  inp.classList.add(ok?'ok':'err');
  const fakeEvt={currentTarget:{dataset:{opt:q.correcta,a:S.screen+'Answer'}}};
  // mark answered
  if(S.screen==='diag'){S.dusr=q.correcta;if(ok)S.dcorrect++;S.dans=true;}
  else if(S.screen==='final'){S.fusr=q.correcta;if(ok)S.fcorrect++;S.fresults.push({q:q.texto.substring(0,55)+'…',ok,c:q.correcta});S.fans=true;}
  else if(S.screen==='vocab'){S.vusr=q.correcta;if(ok)S.vcorrect++;S.vresults.push({q:q.texto.substring(0,55)+'…',ok,c:q.correcta});S.vans=true;}
  else{S.pusr=q.correcta;S.pans=true;}
  render();
}

// ══════════════════════════════════════════════════════════════════
//  STARTERS
// ══════════════════════════════════════════════════════════════════
function startDiag(){
  const ids=pickN(DIAG_IDS,15,S.dprev);
  S.dprev=[...S.dprev,...ids].slice(-30);
  S.dqs=ids.map(getQ).filter(Boolean);
  S.didx=0;S.dcorrect=0;S.dans=false;S.dusr=null;S.screen='diag';render();
}

function startFinal(){
  const u810=FINAL_IDS.filter(id=>{const q=getQ(id);return q&&['u8_voc','u8_gram','u9_voc','u9_gram','u10_voc','u10_gram'].includes(q.tema);});
  const u57=FINAL_IDS.filter(id=>{const q=getQ(id);return q&&['u5_voc','u5_gram','u6_voc','u6_gram','u7_voc','u7_gram'].includes(q.tema);});
  let p810=pickN(u810,35,S.fprev);let p57=pickN(u57,15,S.fprev);
  if(p810.length<35)p810=shuffle(u810).slice(0,35);
  if(p57.length<15)p57=shuffle(u57).slice(0,15);
  const all=shuffle([...p810,...p57]).map(getQ).filter(Boolean);
  all.sort((a,b)=>(a.nivel||1)-(b.nivel||1));
  S.fqs=all;S.fidx=0;S.fcorrect=0;S.fans=false;S.fusr=null;S.fresults=[];S.screen='final';render();
}

function startVocab(){
  const voc=Q.filter(q=>q.tema.endsWith('_voc'));
  const u810=voc.filter(q=>[8,9,10].includes(parseInt(q.tema[1]+''+q.tema[2]||q.tema[1])));
  const u57=voc.filter(q=>[5,6,7].includes(parseInt(q.tema[1])));
  let p810=shuffle(u810.filter(q=>!S.vprev.includes(q.id))).slice(0,35);
  let p57=shuffle(u57.filter(q=>!S.vprev.includes(q.id))).slice(0,15);
  if(p810.length<35)p810=shuffle(u810).slice(0,35);
  if(p57.length<15)p57=shuffle(u57).slice(0,15);
  const all=shuffle([...p810,...p57]);
  all.sort((a,b)=>(a.nivel||1)-(b.nivel||1));
  S.vqs=all;S.vidx=0;S.vcorrect=0;S.vans=false;S.vusr=null;S.vresults=[];S.screen='vocab';render();
}

render();
</script>
