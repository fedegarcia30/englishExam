<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Practice – 2º ESO</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ff;
  --bg2: #ede9fe;
  --card: #ffffff;
  --purple: #7c3aed;
  --purple2: #6d28d9;
  --purple-light: #ddd6fe;
  --pink: #db2777;
  --pink-light: #fce7f3;
  --teal: #0d9488;
  --teal-light: #ccfbf1;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --text: #1e1b4b;
  --muted: #6b7280;
  --green: #059669;
  --green-light: #d1fae5;
  --red: #dc2626;
  --red-light: #fee2e2;
  --border: #e5e7eb;
  --shadow: 0 4px 24px rgba(124,58,237,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.6;
}
h1,h2,h3 { font-family: 'Nunito', sans-serif; }

/* ── LAYOUT ── */
#app { max-width: 800px; margin: 0 auto; padding: 20px 16px 60px; }

/* ── HOME SCREEN ── */
.home-header { text-align: center; padding: 40px 0 32px; }
.home-logo { font-size: 48px; margin-bottom: 8px; }
.home-title { font-size: 2rem; font-weight: 900; color: var(--purple); }
.home-sub { color: var(--muted); font-size: 1rem; margin-top: 6px; }
.home-cards { display: grid; gap: 16px; margin-top: 8px; }
.home-card {
  background: var(--card);
  border-radius: 20px;
  padding: 28px 24px;
  cursor: pointer;
  border: 2px solid transparent;
  box-shadow: var(--shadow);
  transition: all 0.18s ease;
  display: flex; align-items: center; gap: 20px;
}
.home-card:hover { border-color: var(--purple); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,58,237,0.18); }
.home-card-icon { font-size: 2.5rem; flex-shrink: 0; }
.home-card-title { font-family: 'Nunito', sans-serif; font-size: 1.3rem; font-weight: 800; }
.home-card-desc { font-size: 0.9rem; color: var(--muted); margin-top: 2px; }
.card-purple { border-left: 5px solid var(--purple); }
.card-teal { border-left: 5px solid var(--teal); }
.card-pink { border-left: 5px solid var(--pink); }

/* ── SECTION HEADER ── */
.section-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 2px solid var(--purple-light);
}
.section-header h2 { font-size: 1.4rem; font-weight: 800; color: var(--purple); }
.btn-back {
  background: none; border: 2px solid var(--purple-light);
  color: var(--purple); border-radius: 10px; padding: 6px 14px;
  font-size: 0.9rem; font-weight: 700; cursor: pointer;
  font-family: 'Nunito', sans-serif;
  transition: all 0.15s;
}
.btn-back:hover { background: var(--purple-light); }

/* ── TOPIC PICKER ── */
.topics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.topic-btn {
  background: var(--card); border: 2px solid var(--border);
  border-radius: 14px; padding: 16px 14px; cursor: pointer;
  text-align: left; transition: all 0.15s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.topic-btn:hover { border-color: var(--purple); background: var(--bg2); }
.topic-btn .t-unit { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--purple); margin-bottom: 4px; }
.topic-btn .t-name { font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800; color: var(--text); }
.topic-btn .t-type { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

/* ── QUESTION CARD ── */
.q-card { background: var(--card); border-radius: 20px; padding: 28px 24px; box-shadow: var(--shadow); }
.q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.q-badge {
  font-size: 0.75rem; font-weight: 700; padding: 4px 10px;
  border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em;
}
.badge-voc { background: var(--amber-light); color: var(--amber); }
.badge-gram { background: var(--purple-light); color: var(--purple2); }
.q-num { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
.q-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
.q-text em { font-style: italic; color: var(--purple2); font-weight: 700; }

/* Options */
.options { display: grid; gap: 10px; }
.opt-btn {
  background: var(--bg); border: 2px solid var(--border);
  border-radius: 12px; padding: 14px 18px;
  text-align: left; cursor: pointer; font-size: 1rem;
  font-family: 'Nunito Sans', sans-serif; font-weight: 600;
  transition: all 0.15s; color: var(--text);
}
.opt-btn:hover:not(:disabled) { border-color: var(--purple); background: var(--bg2); }
.opt-btn.correct { background: var(--green-light); border-color: var(--green); color: var(--green); }
.opt-btn.wrong { background: var(--red-light); border-color: var(--red); color: var(--red); }
.opt-btn.show-correct { background: var(--green-light); border-color: var(--green); color: var(--green); }
.opt-btn:disabled { cursor: default; }

/* Text input */
.text-input-wrap { display: flex; gap: 10px; margin-top: 4px; }
.text-input {
  flex: 1; padding: 12px 16px; border: 2px solid var(--border);
  border-radius: 12px; font-size: 1rem; font-family: 'Nunito Sans', sans-serif;
  transition: border 0.15s; outline: none;
}
.text-input:focus { border-color: var(--purple); }
.btn-submit {
  background: var(--purple); color: white; border: none;
  border-radius: 12px; padding: 12px 20px; font-weight: 700;
  cursor: pointer; font-size: 1rem; font-family: 'Nunito', sans-serif;
  transition: background 0.15s;
}
.btn-submit:hover { background: var(--purple2); }

/* Feedback */
.feedback {
  margin-top: 16px; border-radius: 12px; padding: 14px 16px;
  font-size: 0.95rem; line-height: 1.5;
}
.feedback.correct { background: var(--green-light); border-left: 4px solid var(--green); color: #065f46; }
.feedback.wrong { background: var(--red-light); border-left: 4px solid var(--red); color: #7f1d1d; }

/* Action row */
.action-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn-next {
  background: var(--purple); color: white; border: none;
  border-radius: 12px; padding: 12px 24px; font-weight: 800;
  cursor: pointer; font-size: 1rem; font-family: 'Nunito', sans-serif;
  transition: background 0.15s; flex: 1;
}
.btn-next:hover { background: var(--purple2); }
.btn-change {
  background: none; border: 2px solid var(--purple-light);
  color: var(--purple); border-radius: 12px; padding: 12px 20px;
  font-weight: 700; cursor: pointer; font-size: 0.95rem;
  font-family: 'Nunito', sans-serif; transition: all 0.15s;
}
.btn-change:hover { background: var(--purple-light); }

/* Progress bar */
.progress-wrap { margin-bottom: 16px; }
.progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--purple), var(--pink)); border-radius: 4px; transition: width 0.4s ease; }

/* Score screen */
.score-card { background: var(--card); border-radius: 24px; padding: 40px 28px; text-align: center; box-shadow: var(--shadow); }
.score-big { font-size: 4rem; font-weight: 900; font-family: 'Nunito', sans-serif; }
.score-label { font-size: 1rem; color: var(--muted); margin-bottom: 16px; }
.score-msg { font-size: 1.2rem; font-weight: 700; margin: 16px 0 28px; }
.score-icon { font-size: 3.5rem; margin-bottom: 8px; }
.btn-primary {
  background: var(--purple); color: white; border: none;
  border-radius: 14px; padding: 14px 28px; font-weight: 800;
  cursor: pointer; font-size: 1.05rem; font-family: 'Nunito', sans-serif;
  transition: background 0.15s; display: inline-block; margin: 6px;
}
.btn-primary:hover { background: var(--purple2); }
.btn-secondary {
  background: none; border: 2px solid var(--purple);
  color: var(--purple); border-radius: 14px; padding: 14px 28px;
  font-weight: 800; cursor: pointer; font-size: 1.05rem;
  font-family: 'Nunito', sans-serif; display: inline-block; margin: 6px;
  transition: all 0.15s;
}
.btn-secondary:hover { background: var(--purple-light); }

/* Result summary */
.results-list { text-align: left; margin: 20px 0; max-height: 320px; overflow-y: auto; }
.result-item { padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 0.9rem; }
.result-item.ok { background: var(--green-light); }
.result-item.ko { background: var(--red-light); }
.result-item .ri-q { font-weight: 600; margin-bottom: 3px; }
.result-item .ri-ans { color: var(--muted); font-size: 0.82rem; }

/* Diag attempt badge */
.attempt-badge {
  text-align: center; padding: 12px;
  background: var(--amber-light); border-radius: 12px;
  color: var(--amber); font-weight: 700; font-size: 0.9rem;
  margin-bottom: 16px;
}
.hidden { display: none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ════════════════════════════════════════
//  QUESTION BANKS
// ════════════════════════════════════════

const TOPICS = [
  { id:"u5_voc", unit:5, name:"Story genres & narrative elements", type:"Vocabulary" },
  { id:"u5_gram", unit:5, name:"Relative clauses", type:"Grammar" },
  { id:"u6_voc", unit:6, name:"Extreme adjectives & make/do", type:"Vocabulary" },
  { id:"u6_gram", unit:6, name:"Passive voice & causative", type:"Grammar" },
  { id:"u7_voc", unit:7, name:"Phrasal verbs & personality", type:"Vocabulary" },
  { id:"u7_gram", unit:7, name:"Let/make, used to, allowed to", type:"Grammar" },
  { id:"u8_voc", unit:8, name:"Crime & reporting verbs", type:"Vocabulary" },
  { id:"u8_gram", unit:8, name:"Reported speech", type:"Grammar" },
  { id:"u9_voc", unit:9, name:"Mystery & go expressions", type:"Vocabulary" },
  { id:"u9_gram", unit:9, name:"Modales de deducción", type:"Grammar" },
  { id:"u10_voc", unit:10, name:"Work, shopping & fluency", type:"Vocabulary" },
  { id:"u10_gram", unit:10, name:"Future continuous & perfect", type:"Grammar" },
];

// Each question: {id, tema, texto, opciones, correcta, explicacion, nivel, tipo:"mc"|"text"}
// tipo "mc" = multiple choice (opciones array), "text" = free text (correcta is string)

const ALL_QUESTIONS = [
// ── U5 VOCABULARIO ──────────────────────────────────────────────
{id:1,tema:"u5_voc",texto:"A book about aliens and spaceships is a...",opciones:["crime novel","science fiction","autobiography"],correcta:"science fiction",explicacion:"Science fiction (ciencia ficción) trata sobre el futuro, el espacio y la tecnología. Una autobiography es la historia de la vida de alguien.",nivel:1},
{id:2,tema:"u5_voc",texto:"The bad character who causes problems in the story is called a...",opciones:["hero","villain","opening"],correcta:"villain",explicacion:"El villain es el personaje malvado. El hero es el bueno y el opening es el comienzo de la historia.",nivel:1},
{id:3,tema:"u5_voc",texto:"The location and atmosphere where the story takes place is called the...",opciones:["plot","dialogue","setting"],correcta:"setting",explicacion:"El setting es el lugar y la época donde ocurre la historia. El plot son los hechos y el dialogue son las conversaciones.",nivel:1},
{id:4,tema:"u5_voc",texto:"The conversations between characters in a novel are called...",opciones:["dialogue","ending","character"],correcta:"dialogue",explicacion:"Dialogue son los diálogos o conversaciones. El ending es el final y character es un personaje.",nivel:1},
{id:5,tema:"u5_voc",texto:"A book based on someone's real life, written by themselves, is an...",opciones:["historical novel","horror story","autobiography"],correcta:"autobiography",explicacion:"Autobiography es cuando alguien escribe la historia de su propia vida. Una historical novel es una novela de época inventada.",nivel:1},
{id:6,tema:"u5_voc",texto:"The events that happen in a story form the...",opciones:["character","plot","setting"],correcta:"plot",explicacion:"El plot es la trama, es decir, los eventos que ocurren en la historia. El character es un personaje.",nivel:2},
{id:7,tema:"u5_voc",texto:"To encourage someone to keep telling a story, you say: '_____, tell me more.'",opciones:["Come on","Go on","Give on"],correcta:"Go on",explicacion:"La expresión correcta es 'Go on, tell me more' (Venga, cuéntame más). 'Come on' significa 'vamos' pero no se usa en esta expresión fija.",nivel:2},
{id:8,tema:"u5_voc",texto:"Choose the correct phrase to start telling something incredible:",opciones:["You will never believe what happened.","You will never think what happened.","You will not believe what you happened."],correcta:"You will never believe what happened.",explicacion:"La expresión fija es 'You will never believe what happened' (Nunca adivinarás lo que pasó). Las demás versiones tienen errores gramaticales.",nivel:2},
{id:9,tema:"u5_voc",texto:"In a story where the main character is scared of vampires, the book is a...",opciones:["romantic novel","horror story","fantasy novel"],correcta:"horror story",explicacion:"Una horror story trata de miedo, monstruos y terror. Una romantic novel es una historia de amor.",nivel:1},
{id:10,tema:"u5_voc",texto:"The hero discovers the crime at the beginning of the book. This happens in the...",opciones:["ending","opening","dialogue"],correcta:"opening",explicacion:"El opening es el comienzo de la historia. El ending es el final. El héroe descubre el crimen al principio, así que es el opening.",nivel:2},
// ── U5 GRAMÁTICA ────────────────────────────────────────────────
{id:11,tema:"u5_gram",texto:"Choose the correct relative pronoun: 'The boy _____ broke my phone has to pay for it.'",opciones:["who","which","whose"],correcta:"who",explicacion:"Use 'who' for people (subject of the clause). 'Which' is for things and 'whose' shows possession.",nivel:1},
{id:12,tema:"u5_gram",texto:"Choose the correct relative pronoun: 'This is the book _____ I borrowed from the library.'",opciones:["who","which","whose"],correcta:"which",explicacion:"Use 'which' (or 'that') for things, not people. A book is not a person, so use 'which'.",nivel:1},
{id:13,tema:"u5_gram",texto:"Complete: 'The girl _____ bag I found lives on my street.'",opciones:["who","which","whose"],correcta:"whose",explicacion:"Use 'whose' to show possession (the girl's bag). It is equivalent to 'her bag'.",nivel:2},
{id:14,tema:"u5_gram",texto:"Choose the correct sentence with a place clause:",opciones:["The school which I study is very old.","The school where I study is very old.","The school who I study is very old."],correcta:"The school where I study is very old.",explicacion:"Use 'where' for places (the school = a place). 'Which' is not correct when referring to a location.",nivel:2},
{id:15,tema:"u5_gram",texto:"Which is the correct NON-DEFINING clause? (with commas)",opciones:["My mum, who is a doctor, works long hours.","My mum who is a doctor works long hours.","My mum which is a doctor works long hours."],correcta:"My mum, who is a doctor, works long hours.",explicacion:"Non-defining clauses go between commas and use 'who' for people. Without commas it would be a defining clause.",nivel:2},
{id:16,tema:"u5_gram",texto:"'I missed the bus, _____ made me late for school.' Which pronoun completes the sentence?",opciones:["that","which","who"],correcta:"which",explicacion:"When the relative pronoun refers to a whole idea (missing the bus), use 'which', never 'that' or 'who'.",nivel:3},
{id:17,tema:"u5_gram",texto:"Find the mistake: 'The man, that lives next door, is my uncle.'",opciones:["that → who (non-defining no usa 'that')","that → which (the man no es persona)","No hay error"],correcta:"that → who (non-defining no usa 'that')",explicacion:"In non-defining clauses (with commas), you cannot use 'that'. You must use 'who' for people.",nivel:3},
{id:18,tema:"u5_gram",texto:"Complete: 'The restaurant _____ we had dinner last year has closed.'",opciones:["where","which","who"],correcta:"where",explicacion:"The restaurant is a place, so use 'where'. You could say 'which we had dinner in' but 'where' is more natural.",nivel:2},
// ── U6 VOCABULARIO ──────────────────────────────────────────────
{id:19,tema:"u6_voc",texto:"'The food was absolutely _____ – I ate everything!' Which extreme adjective fits?",opciones:["delicious","very good","big"],correcta:"delicious",explicacion:"With 'absolutely' we use extreme adjectives like 'delicious', 'amazing', 'fantastic'. You can't say 'absolutely very good'.",nivel:1},
{id:20,tema:"u6_voc",texto:"Which sentence is INCORRECT?",opciones:["She is very hilarious.","She is absolutely hilarious.","She is really funny."],correcta:"She is very hilarious.",explicacion:"'Hilarious' is an extreme adjective. It cannot go with 'very'. Say 'absolutely hilarious' or 'really hilarious'.",nivel:2},
{id:21,tema:"u6_voc",texto:"'It's -10ºC outside. It's absolutely _____.' ¿Qué adjetivo extremo usas?",opciones:["cold","freezing","cool"],correcta:"freezing",explicacion:"'Freezing' is the extreme adjective of 'cold'. With 'absolutely' we always use extreme adjectives, not ordinary ones.",nivel:1},
{id:22,tema:"u6_voc",texto:"Complete: 'In Chemistry class today we are going to _____ an experiment.'",opciones:["make","do","have"],correcta:"do",explicacion:"With 'experiment' use the verb 'do': 'do an experiment'. 'Make' goes with expressions like 'make money' or 'make friends'.",nivel:1},
{id:23,tema:"u6_voc",texto:"'Can you _____ sense of these instructions? They're so confusing!'",opciones:["do","make","take"],correcta:"make",explicacion:"The fixed expression is 'make sense'. 'Do sense' does not exist in English.",nivel:2},
{id:24,tema:"u6_voc",texto:"'My sister _____ very well in her maths exam. She got a 10!'",opciones:["made","did","got"],correcta:"did",explicacion:"The correct expression is 'do well'. 'Made well' is not a correct expression in English.",nivel:2},
// ── U6 GRAMÁTICA ────────────────────────────────────────────────
{id:25,tema:"u6_gram",texto:"Transform into the passive: 'The police arrested the thief.' → '_____ by the police.'",opciones:["The thief was arrested","The thief arrested","The thief is arrested"],correcta:"The thief was arrested",explicacion:"In the past, the passive is: subject + WAS/WERE + past participle. 'Arrest' → 'arrested'. The agent goes with 'by'.",nivel:1},
{id:26,tema:"u6_gram",texto:"Complete in the present passive: 'English _____ all over the world.'",opciones:["is spoken","is speaking","speaks"],correcta:"is spoken",explicacion:"Present passive: is/are + past participle. 'Speak' → past participle 'spoken'. 'Is speaking' is the active present continuous.",nivel:1},
{id:27,tema:"u6_gram",texto:"Which sentence uses the causative correctly? 'I went to a hairdresser for a haircut.'",opciones:["I had my hair cut.","I did my hair cut.","I made my hair cut."],correcta:"I had my hair cut.",explicacion:"The causative is HAVE + object + past participle: 'have my hair cut'. It means someone else did it for you.",nivel:2},
{id:28,tema:"u6_gram",texto:"Complete in the future passive: 'The concert _____ next Saturday.'",opciones:["will be held","will hold","is held"],correcta:"will be held",explicacion:"Future passive: will be + past participle. 'Hold' → past participle 'held'. 'Will hold' is active, not passive.",nivel:2},
{id:29,tema:"u6_gram",texto:"Choose the correct causative form: 'My phone was broken, so I _____ by a technician.'",opciones:["had it repaired","did it repair","had it repair"],correcta:"had it repaired",explicacion:"Causative: HAVE + object + past participle: 'had it repaired'. The past participle of 'repair' is 'repaired'.",nivel:2},
{id:30,tema:"u6_gram",texto:"Transform into the present perfect passive: 'They have built a new school.'",opciones:["A new school has been built.","A new school was built.","A new school is being built."],correcta:"A new school has been built.",explicacion:"Present perfect passive: has/have + been + past participle. 'They have built' → 'A new school has been built'.",nivel:3},
// ── U7 VOCABULARIO ──────────────────────────────────────────────
{id:31,tema:"u7_voc",texto:"'Stop doing something' in English is the phrasal verb...",opciones:["give up","take up","set off"],correcta:"give up",explicacion:"'Give up' means to stop doing something. 'Take up' is to start a new hobby and 'set off' is to begin a journey.",nivel:1},
{id:32,tema:"u7_voc",texto:"'Donna is going to _____ salsa dancing. She starts tonight!'",opciones:["give up","take up","end up"],correcta:"take up",explicacion:"'Take up' means to start a new activity or hobby. 'Give up' is to stop – the opposite.",nivel:1},
{id:33,tema:"u7_voc",texto:"'We got completely lost. We don't know where we're going to _____ up!'",opciones:["end","give","set"],correcta:"end",explicacion:"'End up' means to find yourself somewhere or in a situation, sometimes unexpectedly.",nivel:2},
{id:34,tema:"u7_voc",texto:"Daniel gives presents to all his friends and is always very kind. He is very...",opciones:["selfish","generous","shy"],correcta:"generous",explicacion:"'Generous' describes someone who gives and shares. 'Selfish' is the opposite.",nivel:1},
{id:35,tema:"u7_voc",texto:"'A: I think we should take a break. B: I'm _____ you on this one.' ¿Qué palabra completa la respuesta?",opciones:["for","with","at"],correcta:"with",explicacion:"The expression is 'I'm with you on this one' (I agree with you on this). It is a fixed agreement phrase.",nivel:2},
// ── U7 GRAMÁTICA ────────────────────────────────────────────────
{id:36,tema:"u7_gram",texto:"'My parents _____ me stay up late on Fridays.' Which verb expresses permission?",opciones:["make","let","force"],correcta:"let",explicacion:"'Let' + person + infinitive (without 'to') expresses permission. 'Make' expresses obligation, not permission.",nivel:1},
{id:37,tema:"u7_gram",texto:"'The teacher _____ us do 50 exercises!' Which verb expresses obligation?",opciones:["let","made","allowed"],correcta:"made",explicacion:"'Make' + person + infinitive expresses obligation (someone forces you to do something). 'Let' is permission.",nivel:1},
{id:38,tema:"u7_gram",texto:"Choose the correct option: 'Students _____ use their phones during exams.'",opciones:["aren't allowed to","don't let","aren't let to"],correcta:"aren't allowed to",explicacion:"'Be allowed to' expresses permission or prohibition. 'Aren't allowed to' = not permitted. 'Let' is not used with 'to' this way.",nivel:2},
{id:39,tema:"u7_gram",texto:"'I am _____ to getting up early. I still find it hard!' Which phrase shows you haven't adapted yet?",opciones:["not used","used","get used"],correcta:"not used",explicacion:"'Not used to + -ing' shows you haven't adapted yet. 'Used to + infinitive' talks about past habits – a different structure.",nivel:2},
{id:40,tema:"u7_gram",texto:"'I'm slowly _____ used to living in Madrid.' Which verb completes the adaptation phrase?",opciones:["getting","being","making"],correcta:"getting",explicacion:"'Get used to + -ing' describes the process of adapting. 'Be used to' describes the state of being already adapted.",nivel:2},
{id:41,tema:"u7_gram",texto:"'My parents don't _____ me go to parties on school nights.'",opciones:["let","allow to","make"],correcta:"let",explicacion:"'Let' + person + infinitive without 'to': 'let me go'. With 'allow', you need 'to': 'don't allow me to go'.",nivel:2},
{id:42,tema:"u7_gram",texto:"Find the mistake: 'They made me to do the homework.'",opciones:["Quitar 'to': They made me do the homework.","Cambiar made por let: They let me to do...","No hay error"],correcta:"Quitar 'to': They made me do the homework.",explicacion:"With 'make' and 'let', the next verb goes WITHOUT 'to'. The correct form is 'made me do', not 'made me to do'.",nivel:3},
// ── U8 VOCABULARIO ──────────────────────────────────────────────
{id:43,tema:"u8_voc",texto:"Someone who breaks into a house to steal is a...",opciones:["robber","burglar","pickpocket"],correcta:"burglar",explicacion:"A burglar breaks into houses. A robber steals from banks and a pickpocket steals wallets in the street.",nivel:1},
{id:44,tema:"u8_voc",texto:"Someone who steals your phone from your pocket on the metro is a...",opciones:["mugger","pickpocket","shoplifter"],correcta:"pickpocket",explicacion:"A pickpocket steals from pockets or bags without you noticing. A mugger attacks you physically and a shoplifter steals from shops.",nivel:1},
{id:45,tema:"u8_voc",texto:"Someone who hunts wild animals illegally is a...",opciones:["con man","poacher","mugger"],correcta:"poacher",explicacion:"A poacher hunts animals illegally. A con man tricks people and a mugger attacks people.",nivel:2},
{id:46,tema:"u8_voc",texto:"'Harry _____ his first crime when he was 14.' ¿Qué verbo usas con 'crime'?",opciones:["committed","arrested","caught"],correcta:"committed",explicacion:"The correct collocation is 'commit a crime'. 'Arrest' means to detain someone and 'catch' means to capture.",nivel:1},
{id:47,tema:"u8_voc",texto:"'Betty _____ me to dress up as a monkey for the party.' ¿Qué reporting verb usas?",opciones:["suggested","persuaded","refused"],correcta:"persuaded",explicacion:"'Persuade someone to do something' means to convince someone. 'Suggest' goes with -ing and 'refuse' means to say no.",nivel:2},
{id:48,tema:"u8_voc",texto:"'The doctor _____ doing exercise for 20 minutes a day.' ¿Qué reporting verb encaja?",opciones:["recommended","refused","claimed"],correcta:"recommended",explicacion:"'Recommend + -ing' (to recommend doing something). 'Refuse' means to say no and 'claim' means to state something.",nivel:2},
{id:49,tema:"u8_voc",texto:"'He _____ that he didn't know anything about the theft.' Which verb is used to state something as true?",opciones:["agreed","claimed","refused"],correcta:"claimed",explicacion:"'Claim' means to state or declare something (which may or may not be true). 'Agree' means to accept and 'refuse' means to say no.",nivel:2},
{id:50,tema:"u8_voc",texto:"'They _____ to help me. They said they were too busy.' ¿Qué verbo indica que dijeron que no?",opciones:["agreed","refused","offered"],correcta:"refused",explicacion:"'Refuse to do something' means to say no. 'Agree' means to accept and 'offer' means to propose help.",nivel:1},
// ── U8 GRAMÁTICA ────────────────────────────────────────────────
{id:51,tema:"u8_gram",texto:"Change to reported speech: He said, 'I am tired.' → He said...",opciones:["he was tired.","he is tired.","he were tired."],correcta:"he was tired.",explicacion:"In reported speech, the present simple (am) changes to the past simple (was). 'I am' → 'he was'.",nivel:1},
{id:52,tema:"u8_gram",texto:"Change to reported speech: She said, 'I will call you tomorrow.' → She said...",opciones:["she would call me the next day.","she will call me tomorrow.","she called me the next day."],correcta:"she would call me the next day.",explicacion:"'Will' changes to 'would' in reported speech. 'Tomorrow' changes to 'the next day'.",nivel:2},
{id:53,tema:"u8_gram",texto:"Complete: 'She _____ me when the film started.' (indirect question)",opciones:["asked","said","told"],correcta:"asked",explicacion:"Use 'ask' for indirect questions. 'Tell' needs a personal object ('tell me') and 'say' doesn't take one.",nivel:1},
{id:54,tema:"u8_gram",texto:"Which is the correct reported speech for 'Don't touch my phone!'?",opciones:["She told me not to touch her phone.","She said me don't touch her phone.","She told me to not touch her phone."],correcta:"She told me not to touch her phone.",explicacion:"For negative orders in reported speech, use 'told + not to + infinitive'. 'Said me' is not correct.",nivel:2},
{id:55,tema:"u8_gram",texto:"'He _____ to go home immediately.' Which reporting verb shows he demanded something?",opciones:["claimed","demanded","suggested"],correcta:"demanded",explicacion:"'Demand to do something' expresses a strong requirement. 'Suggest + -ing' means to suggest and 'claim' means to state.",nivel:2},
{id:56,tema:"u8_gram",texto:"Change to reported speech: 'Do you like horror films?' she asked me. → She asked me...",opciones:["if I liked horror films.","if I like horror films.","do I like horror films."],correcta:"if I liked horror films.",explicacion:"Yes/no questions in reported speech use 'if/whether'. The verb changes to the past: 'like' → 'liked'. The word order is affirmative.",nivel:2},
{id:57,tema:"u8_gram",texto:"'He _____ me to study harder.' ¿Qué reporting verb indica que te animó?",opciones:["refused","encouraged","agreed"],correcta:"encouraged",explicacion:"'Encourage someone to do something' means to motivate someone to do it.",nivel:2},
{id:58,tema:"u8_gram",texto:"Find the mistake: 'She said me that she was happy.'",opciones:["Quitar 'me': She said that she was happy.","Añadir 'to': She said to me...","No hay error"],correcta:"Quitar 'me': She said that she was happy.",explicacion:"'Say' doesn't take a personal object. We say 'said that...' or 'told me that...', but never 'said me'.",nivel:3},
// ── U9 VOCABULARIO ──────────────────────────────────────────────
{id:59,tema:"u9_voc",texto:"'The origin of this object is unknown. It's _____.'",opciones:["odd","unexplained","secret"],correcta:"unexplained",explicacion:"'Unexplained' means with no known explanation. 'Odd' means unusual and 'secret' means hidden.",nivel:1},
{id:60,tema:"u9_voc",texto:"'A being from another planet is called an _____.'",opciones:["alien","odd","mysterious"],correcta:"alien",explicacion:"An 'alien' is a being from another planet. 'Odd' means unusual and 'mysterious' means hard to explain.",nivel:1},
{id:61,tema:"u9_voc",texto:"'The video _____ – millions of people watched it in one day!'",opciones:["went viral","went crazy","went well"],correcta:"went viral",explicacion:"'Go viral' means to be shared widely online. 'Go crazy' means to get very excited and 'go well' means to succeed.",nivel:1},
{id:62,tema:"u9_voc",texto:"'The fans _____ when the singer arrived on stage!'",opciones:["went up","went viral","went crazy"],correcta:"went crazy",explicacion:"'Go crazy' means to get extremely excited. 'Go up' means to increase and 'go viral' is for internet content.",nivel:1},
{id:63,tema:"u9_voc",texto:"'A: John has gone missing. B: That _____ be true. I just saw him!'",opciones:["can't","must","might"],correcta:"can't",explicacion:"'Can't be true' expresses impossibility or disbelief. 'Must be' shows certainty and 'might be' shows possibility.",nivel:2},
{id:64,tema:"u9_voc",texto:"'The light in the sky was very _____ – nobody could explain what it was.'",opciones:["secret","puzzling","viral"],correcta:"puzzling",explicacion:"'Puzzling' means confusing or hard to understand. 'Secret' means hidden and 'viral' refers to internet content.",nivel:2},
{id:65,tema:"u9_voc",texto:"'Prices have definitely gone _____. Everything is more expensive now.'",opciones:["viral","up","well"],correcta:"up",explicacion:"'Go up' means to rise or increase (prices, temperature, etc.). 'Go well' means to succeed and 'go viral' means to spread online.",nivel:1},
// ── U9 GRAMÁTICA ────────────────────────────────────────────────
{id:66,tema:"u9_gram",texto:"'I can't find my keys. I _____ them at school.' (deduction about the past)",opciones:["must leave","must have left","can't have left"],correcta:"must have left",explicacion:"To make a certain deduction about the past, use 'must have + past participle'. The correct form is 'must have left'.",nivel:1},
{id:67,tema:"u9_gram",texto:"'He has a Ferrari. He _____ very rich.' (present deduction)",opciones:["must be","can't be","might have been"],correcta:"must be",explicacion:"'Must be' expresses a logical deduction in the present. He has a Ferrari, so he is very likely rich.",nivel:1},
{id:68,tema:"u9_gram",texto:"'There is no way they got lost with a GPS. They _____ lost.' (past impossibility)",opciones:["must have got","can't have got","might have got"],correcta:"can't have got",explicacion:"'Can't have + participio' expresa imposibilidad en el pasado. Si tenían GPS, es imposible que se perdieran.",nivel:2},
{id:69,tema:"u9_gram",texto:"'I'm not sure where she is. She _____ gone home early.' (past possibility)",opciones:["must have","can't have","might have"],correcta:"might have",explicacion:"'Might have + past participle' expresses possibility in the past. We are not sure – it is just possible.",nivel:2},
{id:70,tema:"u9_gram",texto:"'I failed the exam. You _____ more!' (criticism about the past)",opciones:["should have studied","must have studied","might have studied"],correcta:"should have studied",explicacion:"'Should have + past participle' expresses a criticism or regret about something not done in the past.",nivel:2},
{id:71,tema:"u9_gram",texto:"'I dropped my phone in the pool!' → 'You _____ more careful!' ¿Qué forma de crítica usas?",opciones:["should have been","must have been","shouldn't have been"],correcta:"should have been",explicacion:"'Should have been more careful' means you ought to have taken more care (positive criticism: what you should have done).",nivel:2},
{id:72,tema:"u9_gram",texto:"'She is at a tennis academy every day.' → 'She _____ play tennis.' ¿Qué deducción haces?",opciones:["must","can't","shouldn't"],correcta:"must",explicacion:"If she goes to a tennis academy every day, she almost certainly plays tennis. 'Must' expresses logical certainty.",nivel:2},
{id:73,tema:"u9_gram",texto:"Find the mistake: 'They must have went to the party without us.'",opciones:["went → gone: must have gone","must → can't: can't have went","No hay error"],correcta:"went → gone: must have gone",explicacion:"After 'must have', use the past participle (gone), not the past simple (went).",nivel:3},
// ── U10 VOCABULARIO ─────────────────────────────────────────────
{id:74,tema:"u10_voc",texto:"The money you earn for your work is called a...",opciones:["salary","qualification","management"],correcta:"salary",explicacion:"A salary is the money you earn for your work. Qualifications are certificates and management means organising a team.",nivel:1},
{id:75,tema:"u10_voc",texto:"The person you work for is your...",opciones:["employee","employer","manager"],correcta:"employer",explicacion:"The employer is the company or boss that hires you. The employee is the worker.",nivel:1},
{id:76,tema:"u10_voc",texto:"'I want to return this jacket, it doesn't fit. Can I have a _____?'",opciones:["refund","tip","bargain"],correcta:"refund",explicacion:"A refund is money returned when you take something back. A tip is extra money for good service and a bargain is a great deal.",nivel:1},
{id:77,tema:"u10_voc",texto:"'These trainers were only €15! They were a real _____!'",opciones:["tip","bargain","refund"],correcta:"bargain",explicacion:"A bargain is something bought very cheaply. A tip is extra money for good service and a refund is money returned.",nivel:1},
{id:78,tema:"u10_voc",texto:"In England, you normally leave a _____ of 10% for the waiter.",opciones:["bargain","refund","tip"],correcta:"tip",explicacion:"A tip is extra money you leave for a waiter. A bargain is a cheap deal and a refund is money returned.",nivel:1},
{id:79,tema:"u10_voc",texto:"'A: Is there anything else? B: No, _____ _____ .' ¿Cómo terminas educadamente?",opciones:["that's all","same usual","my fault"],correcta:"that's all",explicacion:"'That's all' is the expression used to say you don't need anything else. It is a common fluency phrase.",nivel:2},
{id:80,tema:"u10_voc",texto:"'A: Who broke the vase? B: Don't look at me! It's not my _____ .'",opciones:["fault","problem","tip"],correcta:"fault",explicacion:"'My fault' means it is my mistake. The fixed expression to deny responsibility is 'It's not my fault'.",nivel:2},
{id:81,tema:"u10_voc",texto:"'A: What do you want to drink? B: Orange juice. _____ as _____.'",opciones:["Same / usual","That / all","Same / always"],correcta:"Same / usual",explicacion:"'Same as usual' is a fluency phrase used to ask for the same thing as always.",nivel:2},
// ── U10 GRAMÁTICA ───────────────────────────────────────────────
{id:82,tema:"u10_gram",texto:"'At 8pm tonight, I _____ dinner with my family.' (action in progress in the future)",opciones:["will be having","will have","am having"],correcta:"will be having",explicacion:"The future continuous (will be + -ing) describes an action that will be in progress at a future moment.",nivel:1},
{id:83,tema:"u10_gram",texto:"'By June, she _____ all her exams.' (action completed before a future point)",opciones:["will have finished","will be finishing","finishes"],correcta:"will have finished",explicacion:"The future perfect (will have + past participle) describes an action completed before a future moment.",nivel:2},
{id:84,tema:"u10_gram",texto:"'Don't call me at 10pm – I _____ (sleep).'",opciones:["will be sleeping","will have slept","am sleeping"],correcta:"will be sleeping",explicacion:"'Will be sleeping' (future continuous) shows the action will be in progress at that future point (10pm).",nivel:1},
{id:85,tema:"u10_gram",texto:"'By the time you arrive, I _____ the meal.' (action completed before you arrive)",opciones:["will be cooking","will have cooked","am cooking"],correcta:"will have cooked",explicacion:"'Will have cooked' (future perfect) shows the meal will be ready (completed) before you arrive.",nivel:2},
{id:86,tema:"u10_gram",texto:"Choose the correct option: 'This time next week, we _____ on the beach in Málaga.'",opciones:["will be lying","will have lied","will lie"],correcta:"will be lying",explicacion:"'Will be lying' is the future continuous. It describes what will be happening at a specific future moment.",nivel:2},
{id:87,tema:"u10_gram",texto:"Find the mistake: 'By 2030, scientists will be cured cancer.'",opciones:["will be cured → will have cured","will be cured → will cure","No hay error"],correcta:"will be cured → will have cured",explicacion:"'By 2030' means before a future point, so use the future perfect: 'will have cured'. 'Will be curing' would be future continuous.",nivel:3},
{id:88,tema:"u10_gram",texto:"'_____ you still _____ homework at 9pm tonight?' Future continuous question form?",opciones:["Will / be doing","Are / doing","Will / have done"],correcta:"Will / be doing",explicacion:"The future continuous question is: Will + subject + be + -ing. It asks about an action in progress tonight.",nivel:2},

// ── EXTRA PREGUNTAS PARA BANCO EXAMEN FINAL (U8-10 adicionales y U5-7)────────
{id:89,tema:"u8_gram",texto:"Change to reported speech: 'I can't help you,' he said. → He said...",opciones:["he couldn't help me.","he can't help me.","he could help me."],correcta:"he couldn't help me.",explicacion:"'Can' changes to 'could' in reported speech. Also, 'you' changes to 'me' (the speaker's perspective).",nivel:2},
{id:90,tema:"u8_gram",texto:"'The lawyer _____ his client to say nothing to the police.' (aconsejar firmemente)",opciones:["suggested","told","advised"],correcta:"advised",explicacion:"'Advise someone to do something' means to recommend a course of action. 'Told' is also possible but 'advised' is more precise.",nivel:3},
{id:91,tema:"u8_voc",texto:"Someone who takes things from a shop without paying is a...",opciones:["poacher","shoplifter","con man"],correcta:"shoplifter",explicacion:"A shoplifter steals from shops. A poacher hunts illegally and a con man tricks people.",nivel:1},
{id:92,tema:"u9_gram",texto:"'She's been absent all week. She _____ ill.' (almost certain, present)",opciones:["must be","can't be","might have been"],correcta:"must be",explicacion:"'Must be' expresses a logical deduction about the present. If she has been absent all week, she is almost certainly ill.",nivel:1},
{id:93,tema:"u9_gram",texto:"'You _____ your bag on the bus! Now we have to go back.' (past negative criticism)",opciones:["shouldn't have left","should have left","must have left"],correcta:"shouldn't have left",explicacion:"'Shouldn't have + past participle' expresses that something you did in the past was a mistake.",nivel:2},
{id:94,tema:"u9_voc",texto:"'Everyone knows that. It goes _____ saying.'",opciones:["without","on","up"],correcta:"without",explicacion:"'It goes without saying' means something is so obvious it does not need to be stated. It is a fixed expression.",nivel:3},
{id:95,tema:"u10_gram",texto:"'By this time next year, I _____ school.' (completado en un año)",opciones:["will have finished","will be finishing","am going to finish"],correcta:"will have finished",explicacion:"'Will have finished' (future perfect) because the action will be completed before a future point ('next year').",nivel:2},
{id:96,tema:"u10_voc",texto:"'That painting is very _____. It could be worth millions.' Which word means 'very valuable'?",opciones:["valuable","worth","bargain"],correcta:"valuable",explicacion:"'Valuable' is the adjective meaning of great value. 'Worth' is used as a preposition: 'it's worth €100'. 'Bargain' means a cheap deal.",nivel:2},
{id:97,tema:"u5_gram",texto:"'My best friend, _____ mum is a doctor, lives near me.' ¿Qué pronombre va aquí?",opciones:["who","whose","which"],correcta:"whose",explicacion:"'Whose' shows possession. 'Whose mum' = my best friend's mum.",nivel:2},
{id:98,tema:"u6_gram",texto:"'The president _____ on TV every Friday evening.' (pasiva, acción regular)",opciones:["is seen","sees","was seen"],correcta:"is seen",explicacion:"For a regular action in the passive, use present simple passive: is/are + past participle. 'Sees' is active.",nivel:2},
{id:99,tema:"u7_gram",texto:"'She lived in Paris for a year, so now she's _____ speaking French.' (already adapted)",opciones:["used to","get used to","using to"],correcta:"used to",explicacion:"'Be used to + -ing' describes the state of being already adapted. It takes 'to' + -ing, not the infinitive.",nivel:3},
{id:100,tema:"u8_gram",texto:"'The police said they _____ investigating the case.' (reported speech, presente continuo → pasado continuo)",opciones:["were","are","would be"],correcta:"were",explicacion:"The present continuous 'are investigating' changes to past continuous 'were investigating' in reported speech.",nivel:3},
{id:101,tema:"u9_gram",texto:"'He was at the library all day. He _____ the test.' (imposibilidad, no pudo copiar)",opciones:["can't have cheated on","must have cheated on","might have cheated on"],correcta:"can't have cheated on",explicacion:"'Can't have + past participle' shows something was impossible. If he was in the library, he couldn't have cheated.",nivel:3},
{id:102,tema:"u10_gram",texto:"'At this time tomorrow, I _____ my English exam.' ¿Future continuous?",opciones:["will be taking","will have taken","am taking"],correcta:"will be taking",explicacion:"'Will be taking' is future continuous, showing the exam will be in progress at that time tomorrow.",nivel:2},
{id:103,tema:"u6_gram",texto:"'She went to the salon. She _____ by a stylist.' (causativa)",opciones:["had her hair done","made her hair","did her hair"],correcta:"had her hair done",explicacion:"Causative: 'have something done'. The correct form is 'had her hair done' (the stylist did it, not her).",nivel:2},
{id:104,tema:"u5_voc",texto:"A book set in the 19th century with historical characters is a...",opciones:["science fiction","historical novel","autobiography"],correcta:"historical novel",explicacion:"A historical novel is set in the historical past. An autobiography is about the author's own real life.",nivel:1},
{id:105,tema:"u7_voc",texto:"'We will _____ off at 7am tomorrow for the excursion.' (comenzar el viaje)",opciones:["set","give","end"],correcta:"set",explicacion:"'Set off' means to start a journey. 'Give up' means to quit and 'end up' means to finish somewhere.",nivel:1},
{id:106,tema:"u8_voc",texto:"Someone who attacks you in the street to steal your money is a...",opciones:["burglar","mugger","shoplifter"],correcta:"mugger",explicacion:"A mugger physically attacks people in the street. A burglar breaks into houses and a shoplifter steals from shops.",nivel:1},
{id:107,tema:"u9_voc",texto:"'The atmosphere at the concert was absolutely _____. It felt like magic.'",opciones:["odd","mysterious","secret"],correcta:"mysterious",explicacion:"'Mysterious' describes something magical or unexplained. 'Odd' means unusual and 'secret' means hidden.",nivel:2},
{id:108,tema:"u10_gram",texto:"'By the time he retires, he _____ for 40 years.' (future perfect)",opciones:["will have worked","will be working","has worked"],correcta:"will have worked",explicacion:"'Will have worked' is the future perfect. By the time he retires, he will have accumulated 40 years of work.",nivel:3},
{id:109,tema:"u6_voc",texto:"'The show was absolutely _____! I laughed so much!' Extreme adjective for 'funny'?",opciones:["hilarious","amazing","freezing"],correcta:"hilarious",explicacion:"'Hilarious' is the extreme form of 'funny'. 'Amazing' comes from 'good' and 'freezing' comes from 'cold'.",nivel:1},
{id:110,tema:"u7_gram",texto:"'I _____ to cooking Indian food. Now I love it!' (completed adaptation process)",opciones:["got used","am used","was used"],correcta:"got used",explicacion:"'Got used to + -ing' shows that the process of adapting was successfully completed.",nivel:3},
];

 opciones:["con man","pickpocket","murderer"],correcta:"con man",
 explicacion:"Un <b>con man</b> engaña a las personas para robarles dinero mediante estafas."},

{vid:7,unit:8,tipo:"correct",nivel:1,
 texto:"The criminal had to pay a ___.",
 opciones:["murder","prisoner","fine"],correcta:"fine",
 explicacion:"La palabra correcta es <b>fine</b> (multa). <i>Murder</i> es asesinato y <i>prisoner</i> es prisionero."},

{vid:8,unit:8,tipo:"correct",nivel:1,
 texto:"Police ___ people when they suspect them of a crime.",
 opciones:["commit","arrest","fine"],correcta:"arrest",
 explicacion:"<b>Arrest</b> significa detener a alguien. <i>Commit</i> significa cometer un crimen."},

{vid:9,unit:8,tipo:"correct",nivel:1,
 texto:"Harry ___ his first crime when he was 14.",
 opciones:["caught","committed","arrested"],correcta:"committed",
 explicacion:"La colocación correcta es <b>commit a crime</b> (cometer un crimen). <i>Caught</i> significa ser atrapado."},

{vid:10,unit:8,tipo:"correct",nivel:2,
 texto:"The robbers ___ into the shop at 2 o'clock in the morning.",
 opciones:["fined","broke","got"],correcta:"broke",
 explicacion:"<b>Break into</b> significa entrar por la fuerza en un lugar. 'Break into the shop' = entrar ilegalmente."},

// ── UNIT 8 – Reporting verbs (nivel 2) ──────────────────────────────────────
{vid:11,unit:8,tipo:"mc",nivel:1,
 texto:"We ___ to go to the police station.",
 opciones:["agreed","invited","refused"],correcta:"agreed",
 explicacion:"<b>Agree to do something</b> significa aceptar hacer algo. <i>Refuse</i> sería lo contrario."},

{vid:12,unit:8,tipo:"mc",nivel:1,
 texto:"My dad ___ me to take my driving test.",
 opciones:["claimed","encouraged","refused"],correcta:"encouraged",
 explicacion:"<b>Encourage someone to do something</b> significa animar a alguien a hacer algo."},

{vid:13,unit:8,tipo:"mc",nivel:2,
 texto:"Betty ___ me to dress up as a monkey for the party.",
 opciones:["explained","persuaded","refused"],correcta:"persuaded",
 explicacion:"<b>Persuade someone to do something</b> significa convencer a alguien de que haga algo."},

{vid:14,unit:8,tipo:"mc",nivel:1,
 texto:"The doctor ___ doing more exercise.",
 opciones:["recommended","refused","claimed"],correcta:"recommended",
 explicacion:"<b>Recommend + -ing</b> significa recomendar hacer algo. Nota que va seguido de -ing, no de infinitivo."},

{vid:15,unit:8,tipo:"mc",nivel:2,
 texto:"He ___ that he didn't know anything about the crime.",
 opciones:["agreed","invited","claimed"],correcta:"claimed",
 explicacion:"<b>Claim</b> significa afirmar o declarar algo como verdadero (aunque puede ser mentira)."},

{vid:16,unit:8,tipo:"mc",nivel:1,
 texto:"She ___ to help me. She said she was too busy.",
 opciones:["refused","offered","agreed"],correcta:"refused",
 explicacion:"<b>Refuse to do something</b> significa negarse a hacer algo. <i>Offered</i> sería lo contrario."},

{vid:17,unit:8,tipo:"mc",nivel:1,
 texto:"Paul ___ Meryl to dinner.",
 opciones:["claimed","invited","refused"],correcta:"invited",
 explicacion:"<b>Invite someone to something</b> significa invitar a alguien. Ej: invite her to dinner."},

{vid:18,unit:8,tipo:"mc",nivel:2,
 texto:"She ___ going to the museum to do research.",
 opciones:["persuaded","suggested","refused"],correcta:"suggested",
 explicacion:"<b>Suggest + -ing</b> significa sugerir hacer algo. Va seguido de -ing, no de infinitivo."},

{vid:19,unit:8,tipo:"odd",nivel:2,
 texto:"Which word is the ODD ONE OUT? (not a reporting verb)",
 opciones:["agreed","burglar","suggested"],correcta:"burglar",
 explicacion:"<b>Burglar</b> es un tipo de criminal, no un reporting verb. <i>Agreed</i> y <i>suggested</i> son reporting verbs."},

{vid:20,unit:8,tipo:"odd",nivel:2,
 texto:"Which word is the ODD ONE OUT? (not a type of criminal)",
 opciones:["robber","pickpocket","claimed"],correcta:"claimed",
 explicacion:"<b>Claimed</b> es un reporting verb (afirmar). <i>Robber</i> y <i>pickpocket</i> son tipos de criminales."},

// ── UNIT 9 – Mystery adjectives (nivel 1-2) ─────────────────────────────────
{vid:21,unit:9,tipo:"mc",nivel:1,
 texto:"Don't tell anyone about my ___ diary.",
 opciones:["odd","alien","secret"],correcta:"secret",
 explicacion:"<b>Secret</b> significa secreto, algo que se mantiene oculto. <i>Odd</i> significa extraño."},

{vid:22,unit:9,tipo:"mc",nivel:1,
 texto:"Sophie's brother behaves in a very strange way. He is very ___.",
 opciones:["alien","strange","secret"],correcta:"strange",
 explicacion:"<b>Strange</b> significa extraño o inusual en el comportamiento de una persona."},

{vid:23,unit:9,tipo:"mc",nivel:1,
 texto:"This unusual object is from an ___ planet.",
 opciones:["alien","puzzling","unexplained"],correcta:"alien",
 explicacion:"<b>Alien</b> significa de otro planeta. También se usa como sustantivo para los extraterrestres."},

{vid:24,unit:9,tipo:"mc",nivel:1,
 texto:"The detectives can't solve the mystery. It's very ___.",
 opciones:["secret","puzzling","viral"],correcta:"puzzling",
 explicacion:"<b>Puzzling</b> significa desconcertante, algo muy difícil de entender o resolver."},

{vid:25,unit:9,tipo:"mc",nivel:2,
 texto:"An alien is also known as an ___ being.",
 opciones:["mysterious","extraterrestrial","unexplained"],correcta:"extraterrestrial",
 explicacion:"<b>Extraterrestrial</b> significa de fuera de la Tierra. Es sinónimo formal de <i>alien</i>."},

{vid:26,unit:9,tipo:"mc",nivel:1,
 texto:"When we don't know the origin of something, we say it's ___.",
 opciones:["secret","alien","unexplained"],correcta:"unexplained",
 explicacion:"<b>Unexplained</b> significa sin explicación conocida. Se usa cuando no se sabe el origen de algo."},

{vid:27,unit:9,tipo:"mc",nivel:2,
 texto:"___ is another word for unusual or a bit strange.",
 opciones:["Secret","Viral","Odd"],correcta:"Odd",
 explicacion:"<b>Odd</b> es sinónimo de unusual (inusual) o strange (extraño). Ej: 'That's a bit odd.'"},

// ── UNIT 9 – Go expressions (nivel 1-2) ──────────────────────────────────────
{vid:28,unit:9,tipo:"mc",nivel:1,
 texto:"That video my friend posted ___ within an hour!",
 opciones:["went up","went viral","went crazy"],correcta:"went viral",
 explicacion:"<b>Go viral</b> significa hacerse viral, es decir, que mucha gente comparte algo en internet."},

{vid:29,unit:9,tipo:"mc",nivel:1,
 texto:"I can't wait for the concert! I'm going to ___ when the singer comes on stage!",
 opciones:["go viral","go up","go crazy"],correcta:"go crazy",
 explicacion:"<b>Go crazy</b> significa ponerse muy emocionado o perder la cabeza de entusiasmo."},

{vid:30,unit:9,tipo:"mc",nivel:1,
 texto:"Prices have definitely ___. Everything costs more than before.",
 opciones:["gone viral","gone up","gone crazy"],correcta:"gone up",
 explicacion:"<b>Go up</b> significa subir o aumentar. Se usa para precios, temperaturas, niveles, etc."},

{vid:31,unit:9,tipo:"mc",nivel:2,
 texto:"He ___ writing until the very end of the exam.",
 opciones:["went up","went on","went viral"],correcta:"went on",
 explicacion:"<b>Go on</b> significa continuar haciendo algo. 'He went on writing' = siguió escribiendo."},

{vid:32,unit:9,tipo:"mc",nivel:2,
 texto:"The organisers should ___ to make the show better than last year.",
 opciones:["go well","go one step further","go viral"],correcta:"go one step further",
 explicacion:"<b>Go one step further</b> significa hacer algo extra, ir más allá de lo normal."},

{vid:33,unit:9,tipo:"mc",nivel:2,
 texto:"I hope the investigation into the UFO sighting ___.",
 opciones:["goes viral","goes without saying","goes well"],correcta:"goes well",
 explicacion:"<b>Go well</b> significa ir bien o salir como se esperaba. Ej: 'I hope it goes well!'"},

{vid:34,unit:9,tipo:"match",nivel:2,
 texto:"'Everyone already knows it.' Which 'go' expression matches this?",
 opciones:["go viral","it goes without saying","go crazy"],correcta:"it goes without saying",
 explicacion:"<b>It goes without saying</b> significa que algo es tan obvio que no hace falta ni mencionarlo."},

{vid:35,unit:9,tipo:"match",nivel:1,
 texto:"'To be shared by millions of people online.' Which 'go' expression is this?",
 opciones:["go well","go on","go viral"],correcta:"go viral",
 explicacion:"<b>Go viral</b> es cuando un vídeo, foto o post es compartido por millones de personas en internet."},

// ── UNIT 9 – Deductions vocabulary (nivel 2-3) ──────────────────────────────
{vid:36,unit:9,tipo:"mc",nivel:2,
 texto:"'There's no way they got lost with a GPS.' → They ___ lost.",
 opciones:["must have got","can't have got","might have got"],correcta:"can't have got",
 explicacion:"<b>Can't have + participio</b> expresa que algo fue imposible en el pasado."},

{vid:37,unit:9,tipo:"mc",nivel:2,
 texto:"'He has a Ferrari and a yacht.' → He ___ very rich.",
 opciones:["can't be","must be","might have been"],correcta:"must be",
 explicacion:"<b>Must be</b> expresa una deducción lógica en el presente. Es casi seguro que es rico."},

{vid:38,unit:9,tipo:"mc",nivel:3,
 texto:"'I'm not sure where she went.' → She ___ gone home early.",
 opciones:["must have","can't have","might have"],correcta:"might have",
 explicacion:"<b>Might have + participio</b> expresa una posibilidad en el pasado. No estamos seguros."},

{vid:39,unit:9,tipo:"mc",nivel:3,
 texto:"'That story about the alien is impossible!' → Someone ___ invented it.",
 opciones:["can't have","must have","might be"],correcta:"must have",
 explicacion:"<b>Must have + participio</b> expresa una deducción casi segura sobre el pasado."},

{vid:40,unit:9,tipo:"correct",nivel:3,
 texto:"'I dropped my phone in the pool!' → You ___ more careful!",
 opciones:["should have been","must have been","might have been"],correcta:"should have been",
 explicacion:"<b>Should have + participio</b> expresa una crítica: algo que debías haber hecho pero no hiciste."},

// ── UNIT 10 – Work vocabulary (nivel 1) ──────────────────────────────────────
{vid:41,unit:10,tipo:"mc",nivel:1,
 texto:"The money you earn for your work is called your ___.",
 opciones:["qualification","salary","employer"],correcta:"salary",
 explicacion:"<b>Salary</b> es el salario o sueldo, el dinero que recibes por trabajar."},

{vid:42,unit:10,tipo:"mc",nivel:1,
 texto:"The person or company you work for is your ___.",
 opciones:["employee","employer","management"],correcta:"employer",
 explicacion:"<b>Employer</b> es la empresa o persona que te contrata. <i>Employee</i> eres tú, el trabajador."},

{vid:43,unit:10,tipo:"mc",nivel:1,
 texto:"Doctors and nurses work in the ___ sector.",
 opciones:["finance","management","healthcare"],correcta:"healthcare",
 explicacion:"<b>Healthcare</b> es el sector de la salud. Los médicos y enfermeros trabajan en este sector."},

{vid:44,unit:10,tipo:"mc",nivel:2,
 texto:"You need good ___ to get into a good university.",
 opciones:["salary","qualifications","employers"],correcta:"qualifications",
 explicacion:"<b>Qualifications</b> son los títulos, certificados o diplomas que has obtenido estudiando."},

{vid:45,unit:10,tipo:"mc",nivel:1,
 texto:"If you are good with numbers, you should work in ___.",
 opciones:["healthcare","education","finance"],correcta:"finance",
 explicacion:"<b>Finance</b> es el sector financiero, donde se trabaja con dinero, bancos y cuentas."},

{vid:46,unit:10,tipo:"mc",nivel:2,
 texto:"Richard wants to work in ___. He loves making decisions and leading teams.",
 opciones:["management","education","healthcare"],correcta:"management",
 explicacion:"<b>Management</b> es la gestión o dirección de equipos y empresas."},

{vid:47,unit:10,tipo:"mc",nivel:1,
 texto:"I work in ___. I am a teacher.",
 opciones:["finance","education","healthcare"],correcta:"education",
 explicacion:"<b>Education</b> es el sector de la enseñanza. Los profesores y maestros trabajan aquí."},

// ── UNIT 10 – Shopping / value vocabulary (nivel 1-2) ────────────────────────
{vid:48,unit:10,tipo:"correct",nivel:1,
 texto:"These trainers were only €15 in the sale! They were a real ___.",
 opciones:["refund","bargain","tip"],correcta:"bargain",
 explicacion:"<b>Bargain</b> es una ganga, algo que compraste por mucho menos de su precio normal."},

{vid:49,unit:10,tipo:"correct",nivel:1,
 texto:"Please give your waiter a ___ when you pay your bill in England.",
 opciones:["refund","reward","tip"],correcta:"tip",
 explicacion:"<b>Tip</b> es la propina que dejas al camarero. En Inglaterra es habitual dejar un 10%."},

{vid:50,unit:10,tipo:"correct",nivel:2,
 texto:"I want to return this jacket – it doesn't fit. Can I have a ___?",
 opciones:["bargain","tip","refund"],correcta:"refund",
 explicacion:"<b>Refund</b> es la devolución del dinero cuando devuelves un producto que no funciona o no te gusta."},

{vid:51,unit:10,tipo:"correct",nivel:2,
 texto:"How much do you think this painting is ___? It could be worth millions.",
 opciones:["value","valuable","worth"],correcta:"valuable",
 explicacion:"<b>Valuable</b> es el adjetivo que significa de mucho valor. <i>Worth</i> se usa como preposición: 'it's worth €100'."},

{vid:52,unit:10,tipo:"correct",nivel:2,
 texto:"The family offered a ___ of €1,000 for information about the stolen painting.",
 opciones:["refund","tip","reward"],correcta:"reward",
 explicacion:"<b>Reward</b> es una recompensa que se ofrece a cambio de información o ayuda."},

{vid:53,unit:10,tipo:"correct",nivel:2,
 texto:"Would you like to buy these shoes? They're on ___ this week only.",
 opciones:["bargain","offer","refund"],correcta:"offer",
 explicacion:"<b>On offer</b> significa en oferta, con un descuento especial. <i>Bargain</i> es una ganga ya comprada."},

{vid:54,unit:10,tipo:"correct",nivel:3,
 texto:"Spend €50 in the shop today and get €5 ___ your next purchase.",
 opciones:["on","off","at"],correcta:"off",
 explicacion:"La expresión es <b>€5 off</b> (5€ de descuento). 'Off' indica una reducción del precio."},

{vid:55,unit:10,tipo:"correct",nivel:2,
 texto:"I lent my cousin €20. He ___ me the money.",
 opciones:["refunds","rewards","owes"],correcta:"owes",
 explicacion:"<b>Owe</b> significa deber dinero a alguien. 'He owes me €20' = me debe 20€. <i>Refund</i> es devolver dinero de una compra."},

// ── UNIT 10 – Fluency phrases (nivel 1-2) ────────────────────────────────────
{vid:56,unit:10,tipo:"mc",nivel:1,
 texto:"'A: Is there anything else? B: No, ___ ___.' What completes the answer?",
 opciones:["that's all","same usual","my fault"],correcta:"that's all",
 explicacion:"<b>That's all</b> es la expresión para decir que no necesitas nada más. Muy común en tiendas y restaurantes."},

{vid:57,unit:10,tipo:"mc",nivel:1,
 texto:"'A: Who broke the window? B: Don't look at me! It's not my ___.'",
 opciones:["fault","problem","tip"],correcta:"fault",
 explicacion:"<b>My fault</b> significa 'mi culpa'. La expresión fija es 'It's not my fault' (no es culpa mía)."},

{vid:58,unit:10,tipo:"mc",nivel:1,
 texto:"'A: What would you like? B: Lemonade, ___ as ___.'",
 opciones:["same / usual","that's / all","same / always"],correcta:"same / usual",
 explicacion:"<b>Same as usual</b> significa lo de siempre. Se usa para pedir lo mismo que siempre pides."},

{vid:59,unit:10,tipo:"mc",nivel:2,
 texto:"'A: Shall I pay for the drinks? B: No, ___ are ___ me!'",
 opciones:["these / on","that's / all","same / usual"],correcta:"these / on",
 explicacion:"<b>These are on me</b> significa 'yo invito' o 'yo pago'. Es una expresión de fluency muy natural."},

{vid:60,unit:10,tipo:"mc",nivel:2,
 texto:"'A: Someone wrote that horrible note! B: Don't ___ ___ me!'",
 opciones:["look at","blame on","fault for"],correcta:"look at",
 explicacion:"<b>Don't look at me!</b> significa 'no me mires a mí' (no fui yo). Es una expresión informal."},

// ── UNIT 6 – Extreme adjectives (nivel 1-2) ──────────────────────────────────
{vid:61,unit:6,tipo:"mc",nivel:1,
 texto:"I couldn't stop laughing. The film was ___.",
 opciones:["fascinating","hilarious","freezing"],correcta:"hilarious",
 explicacion:"<b>Hilarious</b> es el adjetivo extremo de 'funny' (muy, muy gracioso). Cuando algo te hace reír muchísimo."},

{vid:62,unit:6,tipo:"mc",nivel:1,
 texto:"It's -5°C outside! It's absolutely ___.",
 opciones:["cold","freezing","tiny"],correcta:"freezing",
 explicacion:"<b>Freezing</b> es el adjetivo extremo de 'cold'. Con 'absolutely' siempre usamos adjetivos extremos."},

{vid:63,unit:6,tipo:"mc",nivel:1,
 texto:"You have an ___ voice. I love listening to you sing.",
 opciones:["awful","freezing","amazing"],correcta:"amazing",
 explicacion:"<b>Amazing</b> es el adjetivo extremo de 'good/great'. Es un gran cumplido para una voz."},

{vid:64,unit:6,tipo:"mc",nivel:1,
 texto:"He got first prize in the competition. He is ___.",
 opciones:["fascinating","delighted","hilarious"],correcta:"delighted",
 explicacion:"<b>Delighted</b> es el adjetivo extremo de 'happy'. Significa muy, muy feliz o encantado."},

{vid:65,unit:6,tipo:"correct",nivel:2,
 texto:"Choose the correct modifier: 'The game was ___ fantastic!'",
 opciones:["very","absolutely","quite"],correcta:"absolutely",
 explicacion:"Con adjetivos extremos como <b>fantastic</b> usamos 'absolutely' o 'really', nunca 'very'."},

{vid:66,unit:6,tipo:"correct",nivel:2,
 texto:"Choose the correct modifier: 'My dad is ___ hilarious.'",
 opciones:["absolutely","very","a bit"],correcta:"absolutely",
 explicacion:"<b>Hilarious</b> es un adjetivo extremo, así que usamos 'absolutely' o 'really', nunca 'very'."},

{vid:67,unit:6,tipo:"correct",nivel:2,
 texto:"Choose the correct modifier: 'The pizza was ___ good.'",
 opciones:["absolutely","really/very","freezing"],correcta:"really/very",
 explicacion:"<b>Good</b> es un adjetivo ordinario, así que usamos 'very' o 'really'. 'Absolutely good' no es correcto."},

{vid:68,unit:6,tipo:"odd",nivel:2,
 texto:"Which adjective is NOT an extreme adjective?",
 opciones:["hilarious","freezing","cold"],correcta:"cold",
 explicacion:"<b>Cold</b> es un adjetivo ordinario. Su versión extrema es 'freezing'. <i>Hilarious</i> y <i>freezing</i> son extremos."},

// ── UNIT 6 – Make / Do expressions (nivel 1-2) ───────────────────────────────
{vid:69,unit:6,tipo:"correct",nivel:1,
 texto:"Today we are going to ___ an experiment.",
 opciones:["make","do","take"],correcta:"do",
 explicacion:"La colocación correcta es <b>do an experiment</b>. Con 'experiment' siempre usamos 'do', nunca 'make'."},

{vid:70,unit:6,tipo:"correct",nivel:1,
 texto:"It's like a type of yoghurt. Does that ___ sense?",
 opciones:["do","take","make"],correcta:"make",
 explicacion:"La expresión fija es <b>make sense</b> (tener sentido). 'Do sense' no existe en inglés."},

{vid:71,unit:6,tipo:"correct",nivel:1,
 texto:"I hope you ___ well in your exams today.",
 opciones:["make","take","do"],correcta:"do",
 explicacion:"La expresión correcta es <b>do well</b> (hacerlo bien, salir bien en algo)."},

{vid:72,unit:6,tipo:"correct",nivel:1,
 texto:"Who ___ the housework in your family?",
 opciones:["makes","takes","does"],correcta:"does",
 explicacion:"La expresión correcta es <b>do the housework</b> (hacer las tareas de casa)."},

{vid:73,unit:6,tipo:"correct",nivel:2,
 texto:"When I grow up, I want to ___ a lot of money.",
 opciones:["do","take","make"],correcta:"make",
 explicacion:"La expresión correcta es <b>make money</b> (ganar dinero). 'Do money' no existe en inglés."},

{vid:74,unit:6,tipo:"correct",nivel:2,
 texto:"Please ___ your way to the auditorium. The concert starts in 5 minutes.",
 opciones:["do","take","make"],correcta:"make",
 explicacion:"La expresión es <b>make your way</b> (dirigirse a un lugar). 'Do your way' es incorrecto."},

// ── UNIT 7 – Phrasal verbs (nivel 1-2) ───────────────────────────────────────
{vid:75,unit:7,tipo:"match",nivel:1,
 texto:"'To discover information' → which phrasal verb matches?",
 opciones:["give up","find out","end up"],correcta:"find out",
 explicacion:"<b>Find out</b> significa descubrir información o enterarse de algo."},

{vid:76,unit:7,tipo:"match",nivel:1,
 texto:"'To stop doing something' → which phrasal verb matches?",
 opciones:["give up","carry on","set off"],correcta:"give up",
 explicacion:"<b>Give up</b> significa dejar de hacer algo o rendirse. Lo contrario de 'carry on'."},

{vid:77,unit:7,tipo:"match",nivel:1,
 texto:"'To start a new hobby' → which phrasal verb matches?",
 opciones:["end up","take up","turn down"],correcta:"take up",
 explicacion:"<b>Take up</b> significa empezar una nueva actividad o hobby. Ej: 'She took up golf.'"},

{vid:78,unit:7,tipo:"match",nivel:2,
 texto:"'To refuse or say no to an offer' → which phrasal verb matches?",
 opciones:["show up","turn down","set off"],correcta:"turn down",
 explicacion:"<b>Turn down</b> significa rechazar una oferta o invitación. Ej: 'He turned down the job.'"},

{vid:79,unit:7,tipo:"correct",nivel:1,
 texto:"___ practising and you will be a great gymnast!",
 opciones:["End up","Give up","Carry on"],correcta:"Carry on",
 explicacion:"<b>Carry on</b> significa continuar haciendo algo. Es sinónimo de 'keep on'. 'Give up' sería lo contrario."},

{vid:80,unit:7,tipo:"correct",nivel:1,
 texto:"I would like to ___ a new sport. Maybe golf or tennis.",
 opciones:["give up","take up","end up"],correcta:"take up",
 explicacion:"<b>Take up</b> significa empezar una nueva actividad. 'Give up' sería dejarlo, lo contrario."},

{vid:81,unit:7,tipo:"correct",nivel:2,
 texto:"After travelling for two days, we ___ in the wrong town!",
 opciones:["set off","showed up","ended up"],correcta:"ended up",
 explicacion:"<b>End up</b> significa terminar en un lugar o situación, a menudo sin haberlo planeado."},

{vid:82,unit:7,tipo:"correct",nivel:2,
 texto:"What time did Helen ___ to the party?",
 opciones:["set off","show up","carry on"],correcta:"show up",
 explicacion:"<b>Show up</b> significa aparecer o llegar a un lugar. 'Set off' es partir, no llegar."},

// ── UNIT 7 – Personality adjectives (nivel 1-2) ──────────────────────────────
{vid:83,unit:7,tipo:"odd",nivel:1,
 texto:"Which word is the ODD ONE OUT? (not a positive personality adjective)",
 opciones:["warm","friendly","cold"],correcta:"cold",
 explicacion:"<b>Cold</b> (frío, distante) es negativo. <i>Warm</i> (cálido) y <i>friendly</i> (amigable) son positivos."},

{vid:84,unit:7,tipo:"odd",nivel:1,
 texto:"Which word is the ODD ONE OUT? (the one positive word among negatives)",
 opciones:["unfriendly","generous","rude"],correcta:"generous",

//  HELPERS
// ════════════════════════════════════════
function getQ(id) { return ALL_QUESTIONS.find(q => q.id === id); }
function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pickN(pool, n, exclude=[]) {
  const available = pool.filter(id => !exclude.includes(id));
  return shuffle(available).slice(0, n);
}
function shuffleOptions(q) {
  if(!q.opciones) return q;
  const opts = shuffle([...q.opciones]);
  return { ...q, opciones: opts };
}

}


// ── VOCAB EXAM ──────────────────────────
function renderVocabExam() {
  const vq = state.vocabExamQuestions[state.vocabExamIndex];
  const n = state.vocabExamIndex + 1;
  const total = state.vocabExamQuestions.length;
  const pct = Math.round((n-1)/total*100);
  const lvlLabel = ['','⚡ Level 1','⚡⚡ Level 2','⚡⚡⚡ Level 3'][vq.nivel] || '';

  const typeLabel = {mc:'Multiple choice',odd:'Odd one out',match:'Match the definition',correct:'Choose the correct word',fill:'Fill in the gap'}[vq.tipo] || '';
  const typeBadge = `<span class="q-badge badge-voc">${typeLabel}</span>`;

  // shuffle options per question (stable per index)
  const opts = [...vq.opciones];

  let optionsHTML = '';
  opts.forEach(opt => {
    let cls = 'opt-btn';
    if(state.vocabExamAnswered) {
      if(opt === vq.correcta) cls += ' correct';
      else if(opt === state.vocabExamUserAnswer && opt !== vq.correcta) cls += ' wrong';
    }
    optionsHTML += `<button class="${cls}" data-action="vocabAnswer" data-opt="${opt}" ${state.vocabExamAnswered?'disabled':''}>${opt}</button>`;
  });

  let feedbackHTML = '';
  if(state.vocabExamAnswered) {
    const ok = state.vocabExamUserAnswer === vq.correcta;
    feedbackHTML = ok
      ? `<div class="feedback correct">✅ Correct! <b>${vq.correcta}</b> is the right answer.</div>`
      : `<div class="feedback wrong">❌ The correct answer is <b>${vq.correcta}</b>. ${vq.explicacion}</div>`;
  }

  let actionHTML = state.vocabExamAnswered
    ? `<div class="action-row"><button class="btn-next" data-action="vocabNext">${n<total?'Next →':'See final score'}</button></div>`
    : '';

  return `
  <div class="section-header">
    <button class="btn-back" data-action="home">← Home</button>
    <h2>📝 Vocabulary Exam</h2>
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><span>Question ${n} of ${total} · ${lvlLabel}</span><span>${state.vocabExamCorrect} correct</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="q-card">
    <div class="q-meta">${typeBadge}<span class="q-num">Unit ${vq.unit} · Vocabulary</span></div>
    <div class="q-text">${vq.texto}</div>
    <div class="options">${optionsHTML}</div>
    ${feedbackHTML}
    ${actionHTML}
  </div>`;
}

function renderVocabScore() {
  const s = state.vocabExamCorrect;
  let icon, msg, color;
  if(s <= 10) { icon='😓'; msg='Keep practising – you can do it! Review the vocabulary topics.'; color='var(--red)'; }
  else if(s <= 20) { icon='🙂'; msg='Good, but there is room for improvement. Check the words you got wrong.'; color='var(--amber)'; }
  else { icon='🌟'; msg='Excellent! You have mastered the vocabulary!'; color='var(--green)'; }

  const resultsHTML = state.vocabExamResults.map(r => `
    <div class="result-item ${r.ok?'ok':'ko'}">
      <div class="ri-q">${r.ok?'✅':'❌'} ${r.q}</div>
      ${!r.ok ? `<div class="ri-ans">Correct answer: <b>${r.correcta}</b></div>` : ''}
    </div>`).join('');

  return `
  <div class="section-header">
    <button class="btn-back" data-action="home">← Home</button>
    <h2>📝 Vocabulary Result</h2>
  </div>
  <div class="score-card">
    <div class="score-icon">${icon}</div>
    <div class="score-big" style="color:${color}">${s}/30</div>
    <div class="score-label">correct answers in the vocabulary exam</div>
    <div class="score-msg">${msg}</div>
    <button class="btn-primary" data-action="retryVocab">Retake exam 🔄</button>
    <button class="btn-secondary" data-action="gotoPractice">Practise by topic</button>
    <button class="btn-secondary" data-action="home">Home</button>
    <div class="results-list">${resultsHTML}</div>
  </div>`;
}
